function checkShape(o){const ch=[o.correct,...(o.wrong||[])].map(s=>String(s||'').trim());if(!o.question||String(o.question).trim().length<15)return 'question too short';if(ch.length!==4||ch.some(c=>!c))return 'needs exactly 4 choices';if(new Set(ch.map(normText)).size!==4)return 'choices repeat';if(ch.some(c=>/\b(all|none|both) of the above\b/i.test(c)))return 'uses "of the above"';const L=ch.map(c=>c.length);if(Math.max(...L)/Math.max(1,Math.min(...L))>2.6)return 'choice lengths too uneven';if(!o.explanation||String(o.explanation).trim().length<20)return 'missing explanation';return '';}

// ---- items: created when first shown, with the right answer at a random position ----
function makeItem(o){E.counter++;const texts=shuffle([o.correct,...o.wrong].map(s=>String(s).trim()));const options=texts.map((text,i)=>({key:LETTERS[i],text}));const item={id:o.id,number:'E-'+E.counter,category:o.category,categoryName:CATEGORIES[o.category],text:String(o.question).trim(),options,correctKey:LETTERS[texts.indexOf(String(o.correct).trim())],explanation:String(o.explanation||'').trim(),whyWrong:String(o.others||'').trim(),difficulty:o.level,source:o.source,createdAt:Date.now()};if(o.model)item.model=o.model;if(o.sources&&o.sources.length)item.sources=o.sources;if(o.asOf)item.asOf=o.asOf;E.items[item.id]=item;return item;}
function itemFromRow(r){return makeItem({id:bankId(r),category:r[0],level:r[1],question:r[2],correct:r[3],wrong:r[4],explanation:r[5],others:r[6],source:'bank'});}
function bankLeft(cats){return BANK_ROWS.filter(r=>(!cats||cats.includes(r[0]))&&!E.items[bankId(r)]).length;}
function genItems(){return Object.values(E.items);}
function eItemStats(){let answered=0,mastered=0,review=0,correct=0,attempts=0;genItems().forEach(q=>{const s=getStats(q.id);if(!s.attempts)return;answered++;correct+=s.correct;attempts+=s.attempts;if(isMastered(q.id))mastered++;if(s.isMistake||isDue(q.id))review++;});return {answered,mastered,review,accuracy:attempts?Math.round(correct/attempts*100):0,attempts};}
function catAccuracy(c){let ok=0,n=0;QUESTIONS.concat(genItems()).forEach(q=>{if(q.category!==c)return;const s=getStats(q.id);ok+=s.correct;n+=s.attempts;});return n?ok/n:0.5;}
function weightedPick(list,weights){const total=weights.reduce((a,b)=>a+b,0);let r=Math.random()*total;for(let i=0;i<list.length;i++){r-=weights[i];if(r<0)return list[i];}return list[list.length-1];}

// ---- choosing the next category and level ----
function hasAI(){return !!getAIKey();}
function usableCats(a){const ai=a.source==='ai'&&hasAI();return a.cats.filter(c=>c!==3||ai);}
function pickCategory(a,cats){if(!cats.length)return null;if(a.catMode==='weak')return weightedPick(cats,cats.map(c=>1+(1-catAccuracy(c))*3));if(a.catMode==='random')return cats[Math.floor(Math.random()*cats.length)];const asked=c=>a.results.filter(r=>r.cat===c).length;const min=Math.min(...cats.map(asked));const low=cats.filter(c=>asked(c)===min);return low[Math.floor(Math.random()*low.length)];}
function pickLevel(a){if(['1','2','3'].includes(a.diffMode))return Number(a.diffMode);if(a.diffMode==='random')return weightedPick([1,2,3],LEVEL_WEIGHTS);return a.level;}
function adjustLevel(a,ok){a.best=Math.max(a.best,a.streak);if(ok){a.up++;a.down=0;}else{a.down++;a.up=0;}if(a.diffMode==='gradual'&&ok&&a.correct%5===0)a.level=Math.min(3,a.level+1);if(a.diffMode==='adaptive'){if(a.up>=3){a.level=Math.min(3,a.level+1);a.up=0;}else if(a.down>=2){a.level=Math.max(1,a.level-1);a.down=0;}}a.top=Math.max(a.top||1,a.level);}
function pickBankRow(cats,level){for(const c of shuffle(cats)){const rows=BANK_ROWS.filter(r=>r[0]===c&&!E.items[bankId(r)]);if(!rows.length)continue;const best=Math.min(...rows.map(r=>Math.abs(r[1]-level)));const near=rows.filter(r=>Math.abs(r[1]-level)===best);return near[Math.floor(Math.random()*near.length)];}return null;}
function pickReplay(a){const flagged=new Set(E.flagged.map(f=>f.id));const pool=genItems().filter(q=>a.cats.includes(q.category)&&!flagged.has(q.id)&&!a.asked.includes(q.id)&&getStats(q.id).attempts);if(!pool.length)return null;const missed=pool.filter(q=>getStats(q.id).lastResult==='incorrect');return shuffle(missed.length?missed:pool)[0];}
// ---- Claude API (only used when the learner adds their own key) ----
const CAT_TOPICS=['pop culture and Philippine and international entertainment, film and streaming, music, notable people, science and discoveries, technology and AI, space, medicine, inventions, sports','economics, geography and geopolitics, world and Philippine history, politics, Philippine government and institutions, international relations, sociology, anthropology, psychology, philosophy, ethics, logic, social movements','Philippine and international visual arts, art movements, music history and theory, Filipino composers and performers, architecture and Philippine heritage, Filipino and world literature, poetry, plays, mythology and folklore, literary concepts','significant Philippine and world news from the last 12 months: Philippine national news and policy, international politics and diplomacy, conflicts, international organizations, economy, science and AI breakthroughs, environment and climate, disasters, major international events'];
const LEVEL_DESC=['solid general knowledge and conceptual understanding','deeper knowledge, interpretation, and telling closely related concepts apart','advanced understanding, analytical reasoning, interdisciplinary connections, or specialized knowledge'];
const Q_SCHEMA={type:'object',properties:{question:{type:'string'},correct:{type:'string'},wrong:{type:'array',items:{type:'string'}},explanation:{type:'string'},why_others_wrong:{type:'string'},topic:{type:'string'},verifiable:{type:'boolean'}},required:['question','correct','wrong','explanation','why_others_wrong','topic','verifiable'],additionalProperties:false};
class AIError extends Error{constructor(kind,msg,wait){super(msg);this.kind=kind;this.wait=wait||0;}}
function aiSystemPrompt(){return 'You are an expert quiz researcher and assessment writer for a serious general-knowledge study app used by Filipino learners. Follow these rules for every question:\n- Exactly one objectively defensible correct answer and three plausible wrong answers from the same subject area.\n- Test real knowledge, comprehension, cause and effect, comparison, or scenario reasoning, not obscure trivia or trick wording. Difficulty must come from the knowledge required.\n- Keep all four choices similar in length, structure, and specificity, with no grammatical clues. Never use "all of the above", "none of the above", or overlapping choices.\n- Clear, precise, self-contained wording. Do not hint at the answer in the question.\n- Balance Philippine and international topics, and do not treat international as only Western: include Asia, Africa, Latin America, and other regions.\n- Check every fact (names, dates, figures, terms) before answering. If you are not sure a fact is accurate, pick a different topic instead of guessing, and set verifiable to false only if you could not avoid uncertainty.\n- explanation: why the answer is correct, with useful context (2 to 4 sentences). why_others_wrong: briefly why each wrong choice is wrong.\n- Write the choices without letters; the app adds A to D and shuffles them.';}
function aiUserPrompt(cat,level,avoid,news){const today=new Date().toISOString().slice(0,10);let p=`Write ONE new multiple-choice question.\nCategory: ${CATEGORIES[cat]}. Topics: ${CAT_TOPICS[cat]}.\nDifficulty: ${LEVELS[level-1]}, meaning it needs ${LEVEL_DESC[level-1]}.\nToday's date: ${today}.`;if(avoid.length)p+=`\nDo not repeat or closely rephrase these questions the learner has already seen, and pick a different subject from them:\n${avoid.map(t=>'- '+t).join('\n')}`;if(news)p+=`\nThis is a current-news question. Use web search to find a significant development from the 12 months before ${today}, confirmed by at least two reliable sources (official government or international bodies, established news organizations). State the time frame in the question when the facts can change. Avoid gossip, viral stories, allegations, predictions, and developing reports.\nWhen you are done researching, reply with ONLY a JSON object, no other text, with these keys: question, correct, wrong (array of exactly 3 strings), explanation, why_others_wrong, topic, verifiable (true or false), as_of (the date of the event, YYYY-MM-DD or YYYY-MM), sources (array of {"title","url"} you actually used).`;else p+='\nwrong must hold exactly 3 strings.';return p;}
async function callClaude(body,key){let messages=body.messages;for(let turn=0;turn<5;turn++){let res;try{res=await fetch(AI_CONFIG.endpoint,{method:'POST',headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':AI_CONFIG.version,'anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({...body,messages})});}catch(e){throw new AIError('network','Could not reach the Claude API. Check your internet connection.');}
if(!res.ok){let msg='';try{msg=(await res.json()).error?.message||'';}catch(e){}const s=res.status;if(s===401)throw new AIError('auth','Claude rejected the API key. Check or replace it in Endless settings.');if(s===403)throw new AIError('auth','This API key is not allowed to make this request. '+msg);if(s===404)throw new AIError('model','This model is not available for your key. Pick another model in Endless settings.');if(s===429)throw new AIError('rate','Too many requests right now.',Number(res.headers.get('retry-after'))||20);if(s===529||s>=500)throw new AIError('busy','Claude is busy at the moment. Please try again shortly.',5);throw new AIError('request','The request was not accepted'+(msg?': '+msg:'.'));}
const data=await res.json();if(data.stop_reason==='pause_turn'){messages=[...messages,{role:'assistant',content:data.content}];continue;}if(data.stop_reason==='refusal')throw new AIError('refusal','Claude declined to write this question.');if(data.stop_reason==='max_tokens')throw new AIError('format','The answer was cut off before it finished.');return data;}throw new AIError('format','The search took too many steps.');}
function collectUrls(x,set){if(!x||typeof x!=='object')return set;if(Array.isArray(x)){x.forEach(v=>collectUrls(v,set));return set;}if(typeof x.url==='string')set.add(x.url);Object.values(x).forEach(v=>{if(v&&typeof v==='object')collectUrls(v,set);});return set;}
function parseJSONText(data){const text=(data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n');const a=text.indexOf('{'),b=text.lastIndexOf('}');if(a<0||b<a)throw new AIError('format','No question came back.');try{return JSON.parse(text.slice(a,b+1));}catch(e){throw new AIError('format','The question came back in the wrong format.');}}
async function generateAI(cat,level){const key=getAIKey();if(!key)throw new AIError('auth','Add a Claude API key to use AI questions.');const news=cat===3;const avoid=genItems().filter(q=>q.category===cat).sort((x,y)=>y.createdAt-x.createdAt).slice(0,25).map(q=>q.text.slice(0,110));const model=E.settings.model||AI_CONFIG.models[0][0];let lastErr=null;
for(let attempt=0;attempt<3;attempt++){try{const body={model,max_tokens:AI_CONFIG.maxTokens,system:aiSystemPrompt(),messages:[{role:'user',content:aiUserPrompt(cat,level,avoid,news)}]};if(news)body.tools=[{type:'web_search_20260209',name:'web_search'}];else body.output_config={format:{type:'json_schema',schema:Q_SCHEMA}};const data=await callClaude(body,key);const o=parseJSONText(data);o.wrong=Array.isArray(o.wrong)?o.wrong.slice(0,3):[];const bad=checkShape(o);if(bad)throw new AIError('format','Rejected a question: '+bad+'.');if(o.verifiable===false)throw new AIError('format','Rejected a question Claude could not verify.');if(isDuplicate(o.question,o.correct))throw new AIError('dup','Rejected a question that repeats one you already have.');let sources=[];if(news){const seen=collectUrls(data.content,new Set());sources=(Array.isArray(o.sources)?o.sources:[]).filter(s=>s&&/^https?:\/\//.test(s.url||'')).map(s=>({title:String(s.title||s.url).slice(0,140),url:String(s.url)}));const found=sources.filter(s=>seen.has(s.url));if(seen.size&&found.length)sources=found;if(!sources.length)throw new AIError('format','Rejected a news question with no checkable source.');}
return makeItem({id:'ai'+hashStr(o.question+Date.now()),category:cat,level,question:o.question,correct:o.correct,wrong:o.wrong,explanation:o.explanation,others:o.why_others_wrong,source:'ai',model,sources:sources.slice(0,4),asOf:news?String(o.as_of||'').slice(0,10):''});}
catch(e){lastErr=e;if(e.kind==='rate'&&e.wait<=20&&attempt<2){await new Promise(r=>setTimeout(r,e.wait*1000));continue;}if(e.kind==='busy'&&attempt<2){await new Promise(r=>setTimeout(r,e.wait*1000));continue;}if(!['format','dup'].includes(e.kind))throw e;}}throw lastErr||new AIError('format','Could not get a usable question.');}
async function testAIKey(){const key=getAIKey();if(!key)throw new AIError('auth','No key saved yet.');await callClaude({model:E.settings.model,max_tokens:16,messages:[{role:'user',content:'Reply with the word OK.'}]},key);}

// ---- session flow ----
function startEndless(){const st=E.settings;const cats=st.catMode==='pick'?st.cats.slice():[0,1,2,3];const a={id:uid(),startedAt:Date.now(),n:0,correct:0,streak:0,best:0,level:st.diffMode==='adaptive'?2:['1','2','3'].includes(st.diffMode)?Number(st.diffMode):1,top:1,up:0,down:0,cats,catMode:st.catMode,diffMode:st.diffMode,source:st.source,shuffle:st.shuffleAnswers,cur:null,results:[],asked:[],replay:false,exhausted:false};if(!cats.length){toast('Choose at least one category.');return;}if(!usableCats(a).length){toast('Current news questions need a Claude API key and the Claude AI source.');return;}a.top=a.level;E.active=a;eSummary=null;eNotice='';ePrefetch=null;saveEndless();nextEndless();}
async function getNextItem(a){const cats=usableCats(a);if(a.replay)return pickReplay(a);const cat=pickCategory(a,cats),level=pickLevel(a);if(a.source==='ai'&&hasAI()){try{let item=null;if(ePrefetch&&ePrefetch.sid===a.id&&cats.includes(ePrefetch.cat)){const p=ePrefetch;ePrefetch=null;item=await p.promise.catch(()=>null);}return item||await generateAI(cat,level);}catch(e){eNotice=e.message+' Using the offline bank for now.';}}const row=pickBankRow(cats.filter(c=>c!==3),level);return row?itemFromRow(row):null;}
async function nextEndless(){const a=E.active;if(!a||eBusy)return;a.cur=null;eBusy=!a.replay&&a.source==='ai'&&hasAI()?(usableCats(a).includes(3)?'news':'ai'):'bank';const slow=setTimeout(()=>{if(eBusy&&E.active===a)render();},250);let item=null;try{item=await getNextItem(a);}catch(e){eNotice=e.message;}clearTimeout(slow);eBusy='';if(E.active!==a)return;if(!item){a.exhausted=true;saveEndless();render();return;}a.exhausted=false;const order=a.shuffle?shuffle(LETTERS):LETTERS.slice();a.cur={id:item.id,sel:null,done:false,ok:false,order,conf:null};a.asked.push(item.id);eFocus='q';saveEndless();render();}
function submitEndless(){const a=E.active;if(!a||!a.cur||a.cur.done||!a.cur.sel)return;const q=E.items[a.cur.id];const ok=a.cur.sel===q.correctKey;a.cur.done=true;eFocus='fb';a.cur.ok=ok;a.n++;if(ok){a.correct++;a.streak++;}else a.streak=0;
const st=getStats(q.id);st.attempts++;if(ok)st.correct++;else st.incorrect++;st.lastResult=ok?'correct':'incorrect';st.lastAnsweredAt=Date.now();if(ok){if(!st.masterySessions.includes(a.id))st.masterySessions.push(a.id);st.masterySessions=st.masterySessions.slice(-5);if(st.masterySessions.length>=3)st.isMistake=false;}else{st.masterySessions=[];st.isMistake=true;st.box=0;st.dueAt=Date.now()+5*60*1000;}recordActivity();
const txt=k=>(q.options.find(o=>o.key===k)||{}).text||'';E.history.unshift({id:q.id,text:q.text,category:q.category,difficulty:q.difficulty,date:Date.now(),correctAnswer:txt(q.correctKey),userAnswer:txt(a.cur.sel),correct:ok,session:a.id});E.history=E.history.slice(0,E_HISTORY_CAP);a.results.push({id:q.id,ok,cat:q.category,level:q.difficulty});adjustLevel(a,ok);saveState();saveEndless();
if(a.source==='ai'&&hasAI()&&!a.replay){const cats=usableCats(a);const cat=pickCategory(a,cats),level=pickLevel(a);ePrefetch={sid:a.id,cat,promise:generateAI(cat,level)};ePrefetch.promise.catch(()=>{});}render();}
function confidenceEndless(conf){const a=E.active;if(!a||!a.cur||!a.cur.ok||a.cur.conf)return;a.cur.conf=conf;const st=getStats(a.cur.id),now=Date.now();if(conf==='hard')st.dueAt=now+15*60*1000;else{st.box=Math.min(5,st.box+(conf==='easy'?2:1));const days=conf==='easy'?[1,3,7,14,30,60]:[1,2,4,8,16,30];st.dueAt=now+days[Math.max(0,Math.min(5,st.box-1))]*86400000;}saveState();saveEndless();toast(conf==='hard'?'Scheduled for review soon.':'Review scheduled.');render();}
function stopEndless(){const a=E.active;if(!a)return;ePrefetch=null;eBusy='';E.active=null;if(!a.n){saveEndless();render();return;}const pct=Math.round(a.correct/a.n*100);const byCat=[0,1,2,3].map(c=>{const r=a.results.filter(x=>x.cat===c);return {c,n:r.length,ok:r.filter(x=>x.ok).length};}).filter(x=>x.n);const sum={id:a.id,startedAt:a.startedAt,finishedAt:Date.now(),n:a.n,correct:a.correct,pct,best:Math.max(a.best,a.streak),top:a.top,byCat,missed:a.results.filter(r=>!r.ok).map(r=>r.id)};E.sessions.unshift(sum);E.sessions=E.sessions.slice(0,30);state.history.unshift({id:a.id,mode:'endless',correct:a.correct,total:a.n,percentage:pct,finishedAt:sum.finishedAt,startedAt:a.startedAt});state.history=state.history.slice(0,30);eSummary=sum;saveState();saveEndless();render();window.scrollTo({top:0,behavior:'smooth'});}
function flagEndless(){const a=E.active;if(!a||!a.cur)return;const q=E.items[a.cur.id];if(E.flagged.some(f=>f.id===q.id)){toast('Already flagged.');return;}E.flagged.push({id:q.id,text:q.text,at:Date.now()});saveEndless();toast('Flagged. It will not come back in replays.');render();}
// ---- shared explanation block (used by Practice, Review and Endless) ----
function explainBlock(q,fallback){if(!q||!q.explanation)return fallback;const src=q.sources&&q.sources.length?`<div class="e-sources"><b>Sources${q.asOf?' · as of '+esc(q.asOf):''}</b>${q.sources.map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.title)}</a>`).join('')}</div>`:'';const mm=AI_CONFIG.models.find(m=>m[0]===q.model);const by=q.source==='ai'?`<p class="e-by">Written by ${esc(mm?mm[1].split(' · ')[0]:(q.model||'Claude'))}. This app checks format and repeats but cannot fact-check it, so flag anything that looks wrong.</p>`:'';return `<div class="e-explain"><p><b>Why this is correct:</b> ${esc(q.explanation)}</p>${q.whyWrong?`<p><b>The other choices:</b> ${esc(q.whyWrong)}</p>`:''}${src}${by}</div>`;}
const qLabel=q=>typeof q.number==='number'?'Q'+q.number:String(q.number);
const lvPill=l=>`<span class="e-chip lv${l}">${LEVELS[l-1]}</span>`;

function eAvail(st,key){const cs=usableCats({source:st.source,cats:st.catMode==='pick'?st.cats:[0,1,2,3]});const ai=st.source==='ai'&&key;const n=bankLeft(cs);const seen=genItems().filter(q=>cs.includes(q.category)&&getStats(q.id).attempts).length;const txt=!cs.length?'Choose at least one category'+(st.cats.includes(3)&&!ai?'. Current news needs Claude AI.':'.'):ai?'Unlimited new questions with Claude AI.':n?`${n} new offline question${n===1?'':'s'} ready for these choices.`:seen?`No new offline questions left. You can replay the ${seen} you have seen.`:'No questions for these choices.';return `<p class="e-avail ${!cs.length||(!ai&&!n&&!seen)?'none':''}" aria-live="polite">${txt}</p>`;}

const chips=CATEGORIES.map((c,i)=>`<label class="cat-chip"><input type="checkbox" data-e-cat="${i}" ${st.cats.includes(i)?'checked':''}><span>${esc(c)}${i===3?'<small>Needs Claude AI + key</small>':''}</span></label>`).join('');

const hist=E.history.slice(0,60).map(h=>`<div class="e-hist ${h.correct?'ok':'bad'}"><div class="e-hist-q"><span>${icon(h.correct?'check':'x')}</span>${esc(h.text)}</div><div class="e-hist-meta">${esc(CATEGORIES[h.category]||'')} · ${LEVELS[(h.difficulty||1)-1]} · ${formatDate(h.date)}</div>${h.correct?`<div class="e-hist-a">Your answer: <b>${esc(h.userAnswer)}</b></div>`:`<div class="e-hist-a">Your answer: ${esc(h.userAnswer)}<br>Correct: <b>${esc(h.correctAnswer)}</b></div>`}</div>`).join('');
return `<div class="page-head"><div><div class="eyebrow">ENDLESS MODE</div><h1>Keep going as long as you like.</h1><p>One question at a time, no fixed end. Stop whenever you want and see how you did.</p></div><span class="tiny-pill">${icon('endless')} <b>${key&&st.source==='ai'?'Unlimited':left}</b> ${key&&st.source==='ai'?'with Claude AI':'offline questions left'}</span></div>
<div class="stats-grid"><div class="stat-card"><div class="stat-top">Answered <span class="stat-icon">${icon('book')}</span></div><div class="stat-value">${total}</div><div class="stat-foot">In Endless mode</div></div><div class="stat-card"><div class="stat-top">Accuracy <span class="stat-icon">${icon('target')}</span></div><div class="stat-value">${total?Math.round(ok/total*100):0}<small style="font-size:12px;color:#9aa4b1;font-weight:650">%</small></div><div class="stat-foot">${ok} correct</div></div><div class="stat-card"><div class="stat-top">Best streak <span class="stat-icon">${icon('flame')}</span></div><div class="stat-value">${best}</div><div class="stat-foot">Correct in a row</div></div><div class="stat-card"><div class="stat-top">Mastered <span class="stat-icon">${icon('endless')}</span></div><div class="stat-value">${gs.mastered}<small style="font-size:12px;color:#9aa4b1;font-weight:650"> / ${gs.answered}</small></div><div class="stat-foot">${gs.review} need review</div></div></div>
<section class="panel e-setup setup-panel"><div class="section-row" style="margin-top:0"><h2>Set up a session</h2><span>Saved automatically</span></div>
<div class="e-grid"><div class="field"><label for="e-catmode">CATEGORIES</label>${sel('e-catmode',CAT_MODES,st.catMode)}</div><div class="field"><label for="e-diff">DIFFICULTY</label>${sel('e-diff',DIFF_MODES,st.diffMode)}</div><div class="field"><label for="e-source">QUESTION SOURCE</label>${sel('e-source',[['bank','Offline bank · '+BANK_ROWS.length+' questions'],['ai','Claude AI · new questions'+(key?'':' (add a key below)')]],st.source)}</div></div>
<div class="e-cats" ${st.catMode==='pick'?'':'hidden'}>${chips}</div>${eAvail(st,key)}
<p class="e-note">${st.source==='ai'&&key?'Claude writes each question fresh. Current news questions use live web search and show their sources.':'The offline bank covers the first three categories. Current news needs up-to-date facts, so it is only available with Claude AI.'}</p>
<div class="setting-card"><div><strong>Shuffle answer choices</strong><p>Show A to D in a new order each time.</p></div><label class="toggle"><input type="checkbox" id="e-shuffle" ${st.shuffleAnswers?'checked':''}><span></span></label></div>
${eNotice?`<p class="e-warn" role="status">${esc(eNotice)}</p>`:''}<button class="btn full e-start" data-e="start">Start Endless session ${icon('arrow')}</button></section>
<details class="panel e-details" id="e-ai" ${eOpenAI||!key&&st.source==='ai'?'open':''}><summary><span>${icon('settings')} Claude AI settings</span><span class="e-chip ${key?'lv1':''}">${key?'Key saved':'No key'}</span></summary>
<p class="sub">Add your own Anthropic API key to get new questions without limit. The key stays only in this browser, is never included in exports, and requests go straight to Anthropic and are billed to your account.</p>
<div class="field"><label for="e-key">API KEY</label><input id="e-key" type="password" autocomplete="off" spellcheck="false" placeholder="${key?'•••••••• saved (paste a new key to replace)':'sk-ant-...'}"></div>
<div class="field"><label for="e-model">MODEL</label>${sel('e-model',AI_CONFIG.models,st.model)}</div>
<div class="e-row"><button class="btn small" data-e="save-key">Save key</button>${key?'<button class="btn secondary small" data-e="test-key">Test connection</button><button class="btn ghost small" data-e="remove-key">Remove key</button>':''}</div><p class="e-key-msg" id="e-key-msg" role="status"></p></details>
<div class="two-col"><section class="panel"><div class="section-row" style="margin-top:0"><h2>Offline bank</h2><span>${left} of ${BANK_ROWS.length} left</span></div><div class="mini-list">${bankRows}</div></section><section class="panel"><div class="section-row" style="margin-top:0"><h2>Past sessions</h2><span>${E.sessions.length?'Latest '+Math.min(6,E.sessions.length):''}</span></div>${sessions?`<div class="mini-list">${sessions}</div>`:'<p class="sub" style="margin:0">Finished sessions will show here.</p>'}</section></div>
<details class="panel e-details"><summary><span>${icon('layers')} Question history</span><span class="e-chip">${total}</span></summary>${hist||'<p class="sub">Questions you answer in Endless mode will show here.</p>'}${total>60?`<p class="sub">Showing the latest 60 of ${total}.</p>`:''}</details>`;}

function renderEndlessQuiz(){return '<div class="e-quiz">'+endlessQuizBody()+'</div>';}
function endlessQuizBody(){const a=E.active,acc=a.n?Math.round(a.correct/a.n*100):0;const lv=LEVELS[(a.cur?E.items[a.cur.id].difficulty:a.level)-1];const bar=`<p class="sr-only" role="status" aria-atomic="true">${a.n} answered, ${a.correct} correct, ${acc} percent accuracy, streak ${a.streak}, level ${lv}.</p><div class="e-bar" aria-hidden="true"><span class="e-chip">${icon('endless')}<b>#${a.n+(a.cur&&!a.cur.done?1:0)}</b></span><span class="e-chip">Score <b>${a.correct}/${a.n}</b></span><span class="e-chip">Accuracy <b>${acc}%</b></span><span class="e-chip">${icon('flame')} <b>${a.streak}</b></span>${a.cur?lvPill(E.items[a.cur.id].difficulty):lvPill(a.level)}</div>`;
const top=`<div class="quiz-top"><button class="back-link" data-e="stop">${icon('back')} End session</button><div class="quiz-tools">${a.cur?`<button class="btn ghost small" data-e="bookmark">${icon('bookmark')} ${getStats(a.cur.id).bookmarked?'Saved':'Save'}</button>`:''}${a.cur&&E.items[a.cur.id].source==='ai'?`<button class="btn ghost small" data-e="flag" title="Report a wrong or unclear AI question">Flag</button>`:''}</div></div>`;
if(eBusy)return top+bar+`<article class="question-card e-loading" aria-busy="true"><span class="e-spin" aria-hidden="true"></span><h2 class="question-text">${eBusy==='news'?'Searching recent news and writing a question…':eBusy==='ai'?'Claude is writing a new question…':'Getting the next question…'}</h2><p class="sub">${eBusy==='bank'?'':eBusy==='news'?'Web search usually takes 10 to 30 seconds.':'This usually takes a few seconds.'}</p></article>`;
if(a.exhausted)return top+bar+`<article class="question-card"><h2 class="question-text">You have seen every question available for these choices.</h2>${eNotice?`<p class="e-warn">${esc(eNotice)}</p>`:''}<p class="sub">The offline bank has ${BANK_ROWS.length} questions. You can replay the ones you have seen (missed ones first), review your mistakes, or add a Claude API key for new questions.</p><div class="e-row">${genItems().some(q=>getStats(q.id).attempts&&a.cats.includes(q.category)&&!E.flagged.some(f=>f.id===q.id))?'<button class="btn" data-e="replay">Replay seen questions</button>':''}<button class="btn secondary" data-e="mistakes">Review mistakes</button>${hasAI()?'':'<button class="btn secondary" data-e="add-key">Add a Claude API key</button>'}<button class="btn ghost" data-e="stop">Stop and see summary</button></div></article>`;
const q=E.items[a.cur.id],c=a.cur;const opts=c.order.map((key,i)=>{const o=q.options.find(x=>x.key===key);let cls='';if(!c.done&&c.sel===key)cls='selected';if(c.done&&key===q.correctKey)cls='correct';if(c.done&&!c.ok&&key===c.sel)cls='incorrect';return `<button class="answer-option ${cls}" data-e-answer="${key}" ${c.done?'disabled':''}><span class="letter">${LETTERS[i]}</span><span>${esc(o.text)}</span></button>`;}).join('');
const label=k=>LETTERS[c.order.indexOf(k)];let fb='';if(c.done){const ct=q.options.find(o=>o.key===q.correctKey).text;fb=`<div class="feedback ${c.ok?'correct':'incorrect'}" role="status"><div class="feedback-head"><span>${icon(c.ok?'check':'x')}</span>${c.ok?'Correct!':'Incorrect!'}</div>${c.ok?'':`<p>Your answer was <b>${esc(q.options.find(o=>o.key===c.sel).text)}</b>. The correct answer is:</p><div class="answer-reveal">${label(q.correctKey)}. ${esc(ct)}</div>`}${explainBlock(q,'')}${c.ok?`<div class="confidence"><span>How confident were you?</span>${[['hard','Difficult'],['okay','Okay'],['easy','Confident']].map(([v,l])=>`<button data-e-conf="${v}" class="${c.conf===v?'chosen':''}" ${c.conf?'disabled':''}>${l}</button>`).join('')}</div>`:''}</div>`;}
const act=c.done?`<div class="quiz-actions"><button class="btn secondary" data-e="stop">End session</button><button class="btn" data-e="next">Next question ${icon('arrow')}</button></div>`:`<div class="quiz-actions"><span class="muted" style="font-size:10px">Choose one answer</span><button class="btn" data-e="submit" ${c.sel?'':'disabled'}>Submit answer ${icon('arrow')}</button></div>`;
return top+bar+`${eNotice?`<p class="e-warn" role="status">${esc(eNotice)}</p>`:''}<article class="question-card"><div class="question-meta"><span class="category-tag">${esc(q.categoryName)}</span><span class="q-number">${esc(q.number)}${a.replay?' · REPLAY':''}${q.source==='ai'?' · CLAUDE AI':''}</span></div><h2 class="question-text">${esc(q.text)}</h2><div class="answers">${opts}</div>${fb}${act}</article><p class="footer-note">Endless mode · ${a.catMode==='pick'?a.cats.map(i=>CATEGORIES[i]).join(', '):CAT_MODES.find(m=>m[0]===a.catMode)[1]} · ${DIFF_MODES.find(m=>m[0]===a.diffMode)[1]}. <span class="e-kbd">Shortcuts: 1–4 choose, Enter submit / next.</span></p>`;}

function renderEndlessSummary(){const s=eSummary,mins=Math.max(1,Math.round((s.finishedAt-s.startedAt)/60000));const missed=s.missed.map(id=>E.items[id]).filter(Boolean);
return `<div class="page-head"><div><div class="eyebrow">ENDLESS SESSION COMPLETE</div><h1>Session summary</h1><p>${formatDate(s.finishedAt)} · about ${mins} minute${mins===1?'':'s'}</p></div><span class="tiny-pill">${icon('endless')} Endless mode</span></div>
<section class="result-hero"><div><h2>${s.pct>=80?'Strong performance.':s.pct>=60?'Good progress.':'Keep building your recall.'}</h2><p>${s.correct} correct out of ${s.n} questions</p></div><div class="result-score">${s.pct}<small>%</small></div></section>
<div class="stats-grid"><div class="stat-card"><div class="stat-top">Answered</div><div class="stat-value">${s.n}</div></div><div class="stat-card"><div class="stat-top">Correct</div><div class="stat-value">${s.correct}</div></div><div class="stat-card"><div class="stat-top">Best streak</div><div class="stat-value">${s.best}</div></div><div class="stat-card"><div class="stat-top">Highest level</div><div class="stat-value" style="font-size:20px">${LEVELS[s.top-1]}</div></div></div>
<div class="section-row"><h2>By category</h2></div><div class="panel"><div class="mini-list">${s.byCat.map(x=>`<div><div class="mini-row"><span>${esc(CATEGORIES[x.c])}</span><strong>${x.ok} / ${x.n}</strong></div><div class="mini-bar"><i style="width:${x.ok/x.n*100}%"></i></div></div>`).join('')}</div></div>
${missed.length?`<div class="section-row"><h2>Questions to review</h2><span>Added to Mistake Review</span></div><div class="review-list">${missed.map(q=>`<div class="review-item"><span class="category-tag">${esc(q.categoryName)}</span><h3 class="question-text" style="font-size:15px">${esc(q.text)}</h3><div class="answer-reveal">${esc(q.options.find(o=>o.key===q.correctKey).text)}</div>${explainBlock(q,'')}</div>`).join('')}</div>`:''}
<div class="e-row" style="margin-top:18px"><button class="btn" data-e="again">Start another session ${icon('arrow')}</button><button class="btn secondary" data-e="home">Back to Endless</button></div>`;}

function bindEndless(){const m=document.getElementById('main');const st=E.settings;const on=(sel,ev,fn)=>m.querySelectorAll(sel).forEach(el=>el.addEventListener(ev,fn));
on('#e-catmode','change',e=>{st.catMode=e.target.value;saveEndless();render();});on('#e-diff','change',e=>{st.diffMode=e.target.value;saveEndless();});on('#e-source','change',e=>{st.source=e.target.value;if(st.source==='ai'&&!hasAI())eOpenAI=true;saveEndless();render();});on('#e-shuffle','change',e=>{st.shuffleAnswers=e.target.checked;saveEndless();});on('#e-model','change',e=>{st.model=e.target.value;saveEndless();});on('[data-e-cat]','change',e=>{const c=Number(e.target.dataset.eCat);st.cats=e.target.checked?[...new Set([...st.cats,c])].sort():st.cats.filter(x=>x!==c);saveEndless();render();document.querySelector(`[data-e-cat="${c}"]`)?.focus();});
on('#e-ai','toggle',e=>{eOpenAI=e.target.open;});on('[data-e-answer]','click',e=>{const a=E.active;if(a&&a.cur&&!a.cur.done){a.cur.sel=e.currentTarget.dataset.eAnswer;eFocus='opt:'+a.cur.sel;saveEndless();render();}});on('[data-e-conf]','click',e=>confidenceEndless(e.currentTarget.dataset.eConf));
on('[data-e]','click',async e=>{const act=e.currentTarget.dataset.e,btn=e.currentTarget;if(act==='start'){eNotice='';startEndless();}else if(act==='submit')submitEndless();else if(act==='next'){eNotice='';nextEndless();}else if(act==='stop'){const c=E.active&&E.active.cur;if(c&&!c.done&&c.sel&&!confirm('End the session? Your chosen answer has not been submitted yet.'))return;stopEndless();}else if(act==='flag')flagEndless();else if(act==='bookmark'){const s=getStats(E.active.cur.id);s.bookmarked=!s.bookmarked;saveState();toast(s.bookmarked?'Saved to bookmarks.':'Removed from bookmarks.');render();}else if(act==='replay'){E.active.replay=true;E.active.asked=[];eNotice='';nextEndless();}else if(act==='mistakes'){stopEndless();eSummary=null;startSession('practice','all','incorrect',20);}else if(act==='add-key'){stopEndless();eSummary=null;eOpenAI=true;render();document.getElementById('e-ai')?.scrollIntoView({behavior:'smooth',block:'center'});}else if(act==='again'){eSummary=null;startEndless();}else if(act==='home'){eSummary=null;render();}
else if(act==='save-key'){const v=(document.getElementById('e-key').value||'').trim();if(!v){toast('Paste your API key first.');return;}if(!/^sk-ant-/.test(v)&&!confirm('This does not look like an Anthropic key (they start with sk-ant-). Save it anyway?'))return;if(!setAIKey(v)){toast('This browser blocked saving the key.');return;}st.source='ai';saveEndless();eOpenAI=true;toast('Key saved in this browser. Claude AI questions are on.');render();}
else if(act==='remove-key'){if(!confirm('Remove your Claude API key from this browser?'))return;setAIKey('');if(st.source==='ai')st.source='bank';saveEndless();toast('Key removed from this browser.');render();}
else if(act==='test-key'){const msg=document.getElementById('e-key-msg');btn.disabled=true;btn.textContent='Testing…';msg.className='e-key-msg';msg.textContent='';try{await testAIKey();msg.className='e-key-msg ok';msg.textContent='Connected. Your key works.';}catch(err){msg.className='e-key-msg bad';msg.textContent=err.message||'The test failed.';}btn.disabled=false;btn.textContent='Test connection';}});
if(eFocus){const f=eFocus;eFocus='';const el=f==='fb'?m.querySelector('.feedback'):f==='q'?m.querySelector('.e-quiz .question-text'):m.querySelector(`[data-e-answer="${f.slice(4)}"]`);if(el){if(f!=='fb'&&f!=='q'){el.focus();}else{el.setAttribute('tabindex','-1');el.focus({preventScroll:true});if(f==='fb')el.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'nearest'});}}}}
document.addEventListener('keydown',e=>{if(page!=='endless'||!E.active||!E.active.cur||state.quizOpen||eBusy||document.querySelector('.modal-backdrop'))return;if(/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName))return;const a=E.active;if(/^[1-4]$/.test(e.key)&&!a.cur.done){a.cur.sel=a.cur.order[Number(e.key)-1];saveEndless();render();}else if(e.key==='Enter'){e.preventDefault();if(a.cur.done)nextEndless();else submitEndless();}});
// Basic integrity assertions: 60 source questions, four options each, and valid A–D answer keys.
function validateQuestionBank(){if(QUESTIONS.length!==60)throw new Error('Question bank must contain exactly 60 questions.');const categoryCounts=CATEGORIES.map((_,i)=>QUESTIONS.filter(q=>q.category===i).length);if(categoryCounts.some(n=>n!==15))throw new Error('Each category must contain exactly 15 questions.');QUESTIONS.forEach(q=>{if(q.options.length!==4||new Set(q.options.map(o=>o.key)).size!==4||!LETTERS.includes(q.correctKey))throw new Error('Invalid question or answer mapping: '+q.id);});if(QUESTIONS.some(q=>!q.text||q.options.some(o=>!o.text)))throw new Error('Missing question content.');return categoryCounts;}
validateQuestionBank();render();
if(document.addEventListener){document.addEventListener('keydown',e=>{if(!state.quizOpen||!state.activeSession)return;const tag=e.target&&e.target.tagName;if(['INPUT','SELECT','TEXTAREA'].includes(tag))return;const s=state.activeSession,q=currentQuestion();if(!q)return;if(/^[1-4]$/.test(e.key)){const key=currentOptionOrder(q.id)[Number(e.key)-1];if(s.mode==='exam')s.answers[q.id]=key;else if(!s.submitted[q.id])s.drafts[q.id]=key;else return;saveState();render();e.preventDefault();return;}if(e.key==='Enter'&&tag!=='BUTTON'&&!e.repeat){if(s.mode==='exam'){if(s.currentIndex<s.queue.length-1)handleQuizAction('next-exam');else if(Object.keys(s.answers).length===s.queue.length)finishExam();}else if(!s.submitted[q.id]&&s.drafts[q.id])handleQuizAction('submit-answer');else if(s.submitted[q.id])handleQuizAction('next-question');e.preventDefault();}});}
</script>
</body>
</html>
