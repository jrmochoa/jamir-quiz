/* ==== Endless mode ==== */
.e-bar{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 12px}
.e-chip{display:inline-flex;align-items:center;gap:5px;min-height:30px;padding:5px 11px;border:1px solid var(--line);background:var(--surface);border-radius:99px;color:var(--muted);font-size:11px;font-weight:650;white-space:nowrap}
.e-chip b{color:var(--ink)}.e-chip svg{width:14px;height:14px}
.e-chip.lv1{background:var(--green-bg);color:var(--green);border-color:transparent}
.e-chip.lv2{background:var(--amber-bg);color:var(--amber);border-color:transparent}
.e-chip.lv3{background:var(--red-bg);color:var(--red);border-color:transparent}
.e-setup{margin-top:18px}
.e-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.e-grid .field{margin:0}
.e-cats{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.e-cats[hidden]{display:none}
.cat-chip{position:relative;cursor:pointer}
.cat-chip input{position:absolute;opacity:0;pointer-events:none}
.cat-chip span{display:flex;flex-direction:column;justify-content:center;min-height:44px;padding:8px 14px;border:1.5px solid var(--line);border-radius:var(--radius-sm);background:var(--surface);font-size:12px;font-weight:650;color:var(--ink);transition:border-color .15s,background .15s}
.cat-chip small{font-size:10px;font-weight:550;color:var(--muted)}
.cat-chip:has(input:checked) span{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 8%,var(--surface))}
.cat-chip input:focus-visible+span{outline:3px solid color-mix(in srgb,var(--brand) 40%,transparent);outline-offset:2px}
.e-note{font-size:12px;color:var(--muted);margin:12px 0}
.e-warn{font-size:12px;background:var(--amber-bg);color:var(--ink);border-radius:var(--radius-sm);padding:10px 13px;margin:10px 0}
.e-start{margin-top:14px}
.e-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.e-details{margin-top:18px}
.e-details>summary{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px;cursor:pointer;font-weight:700;font-size:14px;list-style:none}
.e-details>summary::-webkit-details-marker{display:none}
.e-details>summary>span:first-child{display:inline-flex;align-items:center;gap:8px}
.e-details>summary svg{width:17px;height:17px}
.e-details[open]>summary{margin-bottom:10px}
.e-details input[type=password]{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius-sm);font:inherit;background:var(--surface);color:var(--ink)}
.e-hist{padding:11px 0;border-top:1px solid var(--line)}
.e-hist-q{display:flex;gap:8px;font-size:13px;font-weight:650;color:var(--ink)}
.e-hist-q span{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;background:var(--green-bg);color:var(--green)}
.e-hist.bad .e-hist-q span{background:var(--red-bg);color:var(--red)}
.e-hist-meta{font-size:10px;color:var(--muted);margin:3px 0 0 28px}
.e-hist-a{font-size:12px;color:var(--muted);margin:4px 0 0 28px}
.e-explain{margin-top:12px;font-size:13px;line-height:1.55}
.e-explain p{margin:0 0 8px}
.e-sources{display:flex;flex-direction:column;gap:4px;margin-top:6px;font-size:12px}
.e-sources a{color:var(--brand);word-break:break-word}
.e-by{font-size:11px;color:var(--muted)}
.e-loading{display:flex;flex-direction:column;align-items:center;text-align:center;padding:40px 20px}
.e-spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--brand);animation:e-spin .8s linear infinite;margin-bottom:14px}
@keyframes e-spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.e-spin{animation-duration:2.4s}}
@media(max-width:850px){.e-grid{grid-template-columns:1fr}.e-row .btn{flex:1 1 auto}}
.e-home{width:100%;margin:14px 0 0}
.empty-icon svg{width:22px;height:22px}
.feedback-head span:first-child svg{width:14px;height:14px;stroke-width:2.6}
.e-hist-q span svg{width:12px;height:12px;stroke-width:2.8}
.back-link{display:inline-flex;align-items:center;gap:6px}.back-link svg{width:16px;height:16px}
.ok-mark{display:inline-flex;vertical-align:-2px;margin-left:6px;color:var(--green)}.ok-mark svg{width:15px;height:15px;stroke-width:2.6}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.e-quiz .back-link{min-height:44px}
.e-quiz .btn.small{min-height:40px}

const STORAGE_KEY='knowledgeMastery.quiz.v1';

function cloneData(value){return typeof structuredClone==='function'?structuredClone(value):JSON.parse(JSON.stringify(value));}

function freshStats(){return {attempts:0,correct:0,incorrect:0,masterySessions:[],dueAt:null,box:0,isMistake:false,bookmarked:false,lastResult:null,lastAnsweredAt:null};}
function getStats(qid){if(!state.progress[qid])state.progress[qid]=freshStats();return state.progress[qid];}
function loadState(){try{const raw=localStorage.getItem(STORAGE_KEY);if(!raw)return cloneData(DEFAULT_STATE);const parsed=JSON.parse(raw);const s={...cloneData(DEFAULT_STATE),...parsed,prefs:{...DEFAULT_STATE.prefs,...(parsed.prefs||{})},progress:parsed.progress||{},history:Array.isArray(parsed.history)?parsed.history:[],activityDays:Array.isArray(parsed.activityDays)?parsed.activityDays:[]};return s;}catch(e){return cloneData(DEFAULT_STATE);}}

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function uid(){return 's'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function todayKey(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function formatDate(ts){return new Date(ts).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});}
function formatDue(ts){if(!ts)return 'Not scheduled';const diff=ts-Date.now();if(diff<=0)return 'Due now';if(diff<3600000)return 'In '+Math.ceil(diff/60000)+' min';if(diff<86400000)return 'In '+Math.ceil(diff/3600000)+' hr';return 'In '+Math.ceil(diff/86400000)+' days';}
function isMastered(qid){return getStats(qid).masterySessions.length>=3;}
function isDue(qid){const s=getStats(qid);return !!s.dueAt&&s.dueAt<=Date.now()&&!isMastered(qid);}
function catCounts(i){const qs=QUESTIONS.concat(genItems()).filter(q=>q.category===i);return {m:qs.filter(q=>isMastered(q.id)).length,tot:qs.length+bankLeft([i])};}
function totalQuestions(){return QUESTIONS.length+BANK_ROWS.length+genItems().filter(q=>q.source!=='bank').length;}
function allAttemptCounts(){let correct=0,incorrect=0,answered=0,mastered=0,due=0,mistakes=0,newCount=bankLeft(),learning=0;QUESTIONS.concat(genItems()).forEach(q=>{const s=getStats(q.id);correct+=s.correct;incorrect+=s.incorrect;if(s.attempts)answered++;if(isMastered(q.id))mastered++;else if(s.attempts)learning++;else newCount++;if(isDue(q.id))due++;if(s.isMistake)mistakes++;});return {correct,incorrect,answered,mastered,due,mistakes,newCount,learning,total:totalQuestions(),remaining:totalQuestions()-mastered,accuracy:correct+incorrect?Math.round(correct/(correct+incorrect)*100):0};}
function recordActivity(){const k=todayKey();if(!state.activityDays.includes(k))state.activityDays.push(k);state.activityDays=state.activityDays.slice(-400);}
function streakCount(){const set=new Set(state.activityDays);let d=new Date();if(!set.has(todayKey()))d.setDate(d.getDate()-1);let n=0;while(set.has(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'))){n++;d.setDate(d.getDate()-1);}return n;}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2300);}

const NAV=[['home','Home'],['practice','Practice'],['endless','Endless'],['progress','Progress'],['settings','Settings']];
function renderNav(){const html=NAV.map(([id,label])=>`<button class="nav-item ${page===id?'active':''}" data-page="${id}">${icon(id)}<span>${label}</span></button>`).join('');document.getElementById('side-nav').innerHTML=html;document.getElementById('bottom-nav').innerHTML=html;document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>{page=b.dataset.page;state.quizOpen=false;state.lastExam=null;state.lastSessionResult=null;saveState();render();}));}
function render(){renderNav();const main=document.getElementById('main');if(state.quizOpen&&state.activeSession){main.innerHTML=renderQuiz();bindQuiz();return;}if(state.lastExam&&state.lastExam.show){main.innerHTML=renderExamResult();bindExamResult();return;}if(state.lastSessionResult&&state.lastSessionResult.show){main.innerHTML=renderSessionResult();bindSessionResult();return;}if(page==='endless'){main.innerHTML=renderEndless();bindEndless();return;}if(page==='home')main.innerHTML=renderHome();else if(page==='practice')main.innerHTML=renderPractice();else if(page==='progress')main.innerHTML=renderProgress();else main.innerHTML=renderSettings();bindPage();}
function renderHome(){const s=allAttemptCounts();const cats=CATEGORIES.map((name,i)=>{const {m:n,tot}=catCounts(i);return `<article class="category-card"><div class="category-top"><span class="category-index">0${i+1}</span><span class="tiny-pill">${n}/${tot}</span></div><h3>${esc(name)}</h3><p>${tot} questions · ${n===tot?'Completed':'Mastery in progress'}</p><div class="progress-track"><div class="progress-fill" style="width:${tot?n/tot*100:0}%"></div></div><div class="progress-meta"><span>Mastered</span><strong>${tot?Math.round(n/tot*100):0}%</strong></div></article>`;}).join('');const continueBtn=state.activeSession?`<button class="btn" data-action="resume">Continue session ${icon('arrow')}</button>`:`<button class="btn" data-action="quick-start">Continue learning ${icon('arrow')}</button>`;return `<div class="page-head"><div><div class="eyebrow">YOUR LEARNING SPACE</div><h1>Knowledge, made lasting.</h1><p>A focused way to practice, revisit mistakes, and build real recall.</p></div><span class="tiny-pill">${icon('layers')} <b>${totalQuestions()}</b> questions</span></div>

<div class="stats-grid"><div class="stat-card"><div class="stat-top">Answered <span class="stat-icon">${icon('book')}</span></div><div class="stat-value">${s.answered}<small style="font-size:12px;color:#9aa4b1;font-weight:650"> / ${s.total}</small></div><div class="stat-foot">Unique questions attempted</div></div><div class="stat-card"><div class="stat-top">Accuracy <span class="stat-icon">${icon('target')}</span></div><div class="stat-value">${s.accuracy}%</div><div class="stat-foot">${s.correct} correct · ${s.incorrect} incorrect attempts</div></div><div class="stat-card"><div class="stat-top">Mastered <span class="stat-icon">${icon('check')}</span></div><div class="stat-value">${s.mastered}</div><div class="stat-foot">Correct across 3+ sessions</div></div><div class="stat-card"><div class="stat-top">Review due <span class="stat-icon">${icon('clock')}</span></div><div class="stat-value">${s.due}</div><div class="stat-foot">Ready for spaced review · ${s.mistakes} active mistakes</div></div></div>
<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 2px 8px;font-size:11px;color:var(--muted)"><strong style="color:var(--ink)">Learning progress</strong><span>${s.mastered}/${s.total} mastered · ${s.remaining} remaining</span></div><div class="progress-track" style="margin:0 2px 20px;height:8px"><div class="progress-fill" style="width:${s.mastered/s.total*100}%"></div></div><div class="section-row"><h2>Category mastery</h2><span>Correct in 3 separate sessions to master</span></div><div class="category-grid">${cats}</div>
<div class="two-col"><section><div class="section-row"><h2>Learning overview</h2><span>All ${s.total} questions</span></div><div class="panel"><div class="mini-list"><div><div class="mini-row"><span>New questions</span><strong>${s.newCount}</strong></div><div class="mini-bar"><i style="width:${s.newCount/s.total*100}%"></i></div></div><div><div class="mini-row"><span>Learning</span><strong>${s.learning}</strong></div><div class="mini-bar"><i style="width:${s.learning/s.total*100}%"></i></div></div><div><div class="mini-row"><span>Mastered</span><strong>${s.mastered}</strong></div><div class="mini-bar"><i style="width:${s.mastered/s.total*100}%"></i></div></div></div></div></section><section><div class="section-row"><h2>Your rhythm</h2><span>Consistency</span></div><div class="panel" style="height:calc(100% - 38px);display:flex;flex-direction:column;justify-content:space-between"><div><div style="display:flex;align-items:center;gap:9px;color:#d18a21;font-weight:800;font-size:24px">${icon('flame')} ${streakCount()} <span style="font-size:12px;color:var(--muted);font-weight:650">day streak</span></div><p class="sub" style="margin-top:8px">A learning day is recorded whenever you answer a question.</p></div><button class="btn secondary full" data-page="progress">View progress ${icon('arrow')}</button></div></section></div><p class="footer-note">Your learning data stays in this browser on this device. Export a backup in Settings.</p>`;}
function renderPractice(){const counts=allAttemptCounts();return `<div class="page-head"><div><div class="eyebrow">CHOOSE HOW TO LEARN</div><h1>Practice with purpose.</h1><p>Pick a mode, narrow the question set, and start a focused session.</p></div>${state.activeSession?'<button class="btn secondary small" data-action="resume">Resume session</button>':''}</div>
<div class="mode-grid"><button class="mode-card" data-mode="practice"><span class="mode-icon">${icon('book')}</span><span><strong>Practice mode</strong><small>Immediate feedback, no timer. Learn as you go.</small></span></button><button class="mode-card" data-mode="exam"><span class="mode-icon">${icon('target')}</span><span><strong>Exam mode</strong><small>Answer everything first. Review results at the end.</small></span></button><button class="mode-card" data-mode="mistakes"><span class="mode-icon">${icon('refresh')}</span><span><strong>Mistake review</strong><small>Retry missed questions until you demonstrate mastery.</small><small style="color:var(--red);margin-top:5px">${getPool('all','incorrect').length} active questions</small></span></button><button class="mode-card" data-mode="spaced"><span class="mode-icon">${icon('clock')}</span><span><strong>Spaced repetition</strong><small>Prioritize questions scheduled for review.</small><small style="color:var(--teal);margin-top:5px">${getPool('all','due').length} due now</small></span></button><button class="mode-card" data-mode="mastery"><span class="mode-icon">${icon('star')}</span><span><strong>Mastery mode</strong><small>Work on questions not yet mastered.</small><small style="color:var(--brand);margin-top:5px">${getPool('all','unmastered').length} remaining</small></span></button><button class="mode-card" data-page="endless"><span class="mode-icon">${icon('endless')}</span><span><strong>Endless mode</strong><small>No fixed end. New questions until you stop.</small><small style="color:var(--brand);margin-top:5px">${bankLeft()} offline questions left</small></span></button></div>
<section class="panel setup-panel"><div class="section-row" style="margin:0 0 14px"><h2>Session setup</h2><span id="available-count">${getPool('all','all').length} available</span></div><div class="form-grid"><div class="field"><label for="setup-category">CATEGORY</label><select id="setup-category"><option value="all">All categories</option>${CATEGORIES.map((c,i)=>`<option value="${i}">${esc(c)}</option>`).join('')}</select></div><div class="field"><label for="setup-filter">QUESTION SET</label><select id="setup-filter"><option value="all">All questions</option><option value="unanswered">Unanswered only</option><option value="incorrect">Active mistakes</option><option value="due">Due for review</option><option value="unmastered">Not yet mastered</option><option value="bookmarked">Bookmarked</option></select></div><div class="field"><label for="setup-count">QUESTION COUNT</label><input type="number" id="setup-count" min="1" max="${getPool('all','all').length}" value="15" inputmode="numeric"></div></div><div class="setup-bottom"><div style="display:flex;gap:15px;flex-wrap:wrap"><label class="checkline"><input type="checkbox" id="setup-shuffle-q" ${state.prefs.shuffleQuestions?'checked':''}> Shuffle questions</label><label class="checkline"><input type="checkbox" id="setup-shuffle-a" ${state.prefs.shuffleAnswers?'checked':''}> Shuffle answer choices</label></div><button class="btn" data-action="start-setup">Start ${icon('arrow')}</button></div><p class="sub" id="setup-hint" style="margin:11px 0 0">Choose a category or question set. Question count is capped to the available questions.</p></section>
<div class="section-row"><h2>How mastery works</h2><span>Leitner-style review</span></div><div class="panel"><p class="sub" style="margin:0">A question becomes <b>mastered</b> only after three correct answers in three separate sessions. An incorrect answer resets its mastery streak and adds it to Mistake Review. Correct answers that feel difficult return later in the same session; review intervals grow as confidence improves.</p></div>`;}
function getSelectedModeFilter(mode){if(mode==='mistakes')return'incorrect';if(mode==='spaced')return'due';if(mode==='mastery')return'unmastered';return'all';}
function getPool(category,filter){const extra=['incorrect','due','bookmarked'].includes(filter)?genItems().filter(q=>{const st=getStats(q.id);return st.attempts||st.bookmarked;}):[];return QUESTIONS.concat(extra).filter(q=>(category==='all'||q.category===Number(category))&&(filter==='all'||(filter==='unanswered'&&getStats(q.id).attempts===0)||(filter==='incorrect'&&getStats(q.id).isMistake)||(filter==='due'&&isDue(q.id))||(filter==='unmastered'&&!isMastered(q.id))||(filter==='bookmarked'&&getStats(q.id).bookmarked)));}
function updateSetupAvailability(){const cat=document.getElementById('setup-category'),filter=document.getElementById('setup-filter'),count=document.getElementById('setup-count'),label=document.getElementById('available-count');if(!cat||!filter||!count)return;const pool=getPool(cat.value,filter.value);label.textContent=pool.length+' available';count.max=Math.max(1,pool.length);if(Number(count.value)>pool.length)count.value=pool.length||1;const hint=document.getElementById('setup-hint');if(hint)hint.textContent=pool.length?`Up to ${pool.length} question${pool.length===1?'':'s'} match this selection.`:'No questions match this selection yet. Try another category or question set.';}
function startSession(mode,category,filter,count){page='practice';const pool=getPool(category,filter);if(!pool.length){toast('No questions match this selection yet.');return;}const amount=Math.max(1,Math.min(pool.length,Number(count)||pool.length));let selected=pool.slice();if(state.prefs.shuffleQuestions)selected=shuffle(selected);selected=selected.slice(0,amount);const optionOrders={};selected.forEach(q=>{let keys=LETTERS.slice();if(state.prefs.shuffleAnswers)keys=shuffle(keys);optionOrders[q.id]=keys;});state.activeSession={id:uid(),mode,category,filter,count:amount,queue:selected.map(q=>q.id),currentIndex:0,optionOrders,answers:{},drafts:{},submitted:{},retryQueue:[],requeuedIds:[],retryExpanded:false,practiceResults:[],startedAt:Date.now(),finished:false};state.quizOpen=true;state.lastExam=null;state.lastSessionResult=null;saveState();render();}
function qById(id){return QUESTIONS.find(q=>q.id===id)||E.items[id];}
function currentQuestion(){const s=state.activeSession;return s&&qById(s.queue[s.currentIndex]);}
function currentOptionOrder(qid){const s=state.activeSession;return (s.optionOrders[qid]||LETTERS).slice();}
function displayLabel(qid,key){return LETTERS[currentOptionOrder(qid).indexOf(key)]||key;}
function currentModeLabel(mode){return ({practice:'Practice mode',exam:'Exam mode',mistakes:'Mistake review',spaced:'Spaced repetition',mastery:'Mastery mode',endless:'Endless mode'})[mode]||'Practice';}
function renderQuiz(){const s=state.activeSession,q=currentQuestion();if(!q)return '<div class="empty-state"><h3>No question found</h3><button class="btn" data-action="exit-quiz">Back to Practice</button></div>';const idx=s.currentIndex+1,total=s.queue.length,progress=Math.round((idx-1)/total*100);const isExam=s.mode==='exam';const submitted=!!s.submitted[q.id];const selected=isExam?s.answers[q.id]:(submitted?s.submitted[q.id].selectedKey:s.drafts[q.id]);const order=currentOptionOrder(q.id);const options=order.map((key,i)=>{const opt=q.options.find(o=>o.key===key);let cls='';if(selected===key&&!submitted)cls='selected';if(submitted&&s.submitted[q.id].correct&&key===q.correctKey)cls='correct';if(submitted&&!s.submitted[q.id].correct&&key===s.submitted[q.id].selectedKey)cls='incorrect';if(submitted&&!s.submitted[q.id].correct&&key===q.correctKey)cls='correct';return `<button class="answer-option ${cls}" data-answer="${key}" ${submitted&&!isExam?'disabled':''}><span class="letter">${LETTERS[i]}</span><span>${esc(opt.text)}</span></button>`;}).join('');let feedback='';if(submitted&&!isExam){const rec=s.submitted[q.id],correctText=q.options.find(o=>o.key===q.correctKey).text;feedback=`<div class="feedback ${rec.correct?'correct':'incorrect'}"><div class="feedback-head"><span>${icon(rec.correct?'check':'x')}</span>${rec.correct?'Correct!':'Incorrect!'}</div>${rec.correct?'<p>You selected the correct answer.</p>':`<p>Your selected answer was <b>${esc(q.options.find(o=>o.key===rec.selectedKey).text)}</b>. The correct answer is:</p>`}<div class="answer-reveal">${displayLabel(q.id,q.correctKey)}. ${esc(correctText)}</div>${explainBlock(q,'<p class="source-note">No written explanation was included with this question in the supplied source bank. The original question and answer key are preserved without adding an unsupported explanation.</p>')}${rec.correct?`<div class="confidence"><span>How confident were you?</span><button data-confidence="hard" class="${rec.confidence==='hard'?'chosen':''}">Difficult</button><button data-confidence="okay" class="${rec.confidence==='okay'?'chosen':''}">Okay</button><button data-confidence="easy" class="${rec.confidence==='easy'?'chosen':''}">Confident</button></div>`:''}</div>`;}
const done=Object.keys(s.answers).length;let examControls='';if(isExam){examControls=`<p class="exam-progress-text">${done} of ${total} answered · You can change answers until you submit the exam.</p><div class="exam-picker">${s.queue.map((id,i)=>`<button class="exam-dot ${s.answers[id]?'answered':''} ${i===s.currentIndex?'current':''}" data-goto="${i}" title="Question ${i+1}${s.answers[id]?' answered':''}">${i+1}</button>`).join('')}</div>`;}
const qTools=`<div class="quiz-tools"><button class="btn ghost small" data-action="bookmark" title="Bookmark this question">${icon('bookmark')} ${getStats(q.id).bookmarked?'Saved':'Save'}</button><button class="btn ghost small" data-action="restart" title="Restart this session">${icon('refresh')} Restart</button><button class="btn ghost small" data-action="pause">Exit</button></div>`;
let actions='';if(isExam){actions=`<div class="quiz-actions"><button class="btn secondary" data-action="prev" ${s.currentIndex===0?'disabled':''}>Previous</button>${s.currentIndex<total-1?`<button class="btn" data-action="next-exam">Next ${icon('arrow')}</button>`:`<button class="btn" data-action="finish-exam" ${done!==total?'disabled':''}>Submit exam</button>`}</div>`;}else if(!submitted){actions=`<div class="quiz-actions"><span class="muted" style="font-size:10px">Choose one answer</span><button class="btn" data-action="submit-answer" ${selected?'':'disabled'}>Submit answer ${icon('arrow')}</button></div>`;}else{actions=`<div class="quiz-actions"><button class="btn secondary" data-action="pause">Exit session</button><button class="btn" data-action="next-question">${s.currentIndex===total-1&&s.retryQueue.length===0?'Finish session':'Next question'} ${icon('arrow')}</button></div>`;}
return `<div class="quiz-top"><button class="back-link" data-action="pause">${icon('back')} ${currentModeLabel(s.mode)}</button>${qTools}</div><div class="quiz-progress"><i style="width:${Math.max(4,progress)}%"></i></div><article class="question-card"><div class="question-meta"><span class="category-tag">${esc(q.categoryName)}</span><span class="q-number">QUESTION ${q.number} · ${idx} OF ${total}</span></div><h2 class="question-text">${esc(q.text)}</h2>${examControls}<div class="answers">${options}</div>${feedback}${actions}</article><p class="footer-note">${isExam?'Exam mode · Feedback and correct answers appear after submission.':'Practice mode · Review the answer before moving on.'} ${state.prefs.shuffleAnswers?'Answer choices may be shuffled.':''} Desktop shortcut: 1–4 select, Enter submit/advance.</p>`;}
function bindQuiz(){const s=state.activeSession,q=currentQuestion();if(!s||!q)return;document.querySelectorAll('[data-answer]').forEach(b=>b.addEventListener('click',()=>{if(s.mode==='exam'){s.answers[q.id]=b.dataset.answer;}else if(!s.submitted[q.id]){s.drafts[q.id]=b.dataset.answer;}saveState();render();}));document.querySelectorAll('[data-confidence]').forEach(b=>b.addEventListener('click',()=>{setConfidence(q.id,b.dataset.confidence);render();}));document.querySelectorAll('[data-goto]').forEach(b=>b.addEventListener('click',()=>{s.currentIndex=Number(b.dataset.goto);saveState();render();}));document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>handleQuizAction(b.dataset.action)));}
function playFeedback(correct){if(state.prefs.sound){try{const AudioContext=window.AudioContext||window.webkitAudioContext;if(AudioContext){const ctx=new AudioContext();const osc=ctx.createOscillator(),gain=ctx.createGain();osc.type='sine';osc.frequency.value=correct?660:220;gain.gain.value=.04;osc.connect(gain);gain.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+.11);osc.onended=()=>ctx.close();}}catch(e){}}if(state.prefs.haptics&&navigator.vibrate)navigator.vibrate(correct?35:[35,35,35]);}
function recordAttempt(q,selectedKey,sessionId,confidence){const stats=getStats(q.id);const correct=selectedKey===q.correctKey;if(state.activeSession&&state.activeSession.mode!=='exam')state.activeSession.practiceResults.push({id:q.id,correct,selectedKey,at:Date.now()});stats.attempts++;if(correct)stats.correct++;else stats.incorrect++;stats.lastResult=correct?'correct':'incorrect';stats.lastAnsweredAt=Date.now();if(correct){if(!stats.masterySessions.includes(sessionId))stats.masterySessions.push(sessionId);stats.masterySessions=stats.masterySessions.slice(-5);if(stats.masterySessions.length>=3)stats.isMistake=false;}else{stats.masterySessions=[];stats.isMistake=true;}recordActivity();if(!correct)updateSpacedSchedule(q,false,confidence,sessionId);else if(state.activeSession&&state.activeSession.mode==='exam')updateSpacedSchedule(q,true,'okay',sessionId);return correct;}
function updateSpacedSchedule(q,correct,confidence,sessionId){const st=getStats(q.id),s=state.activeSession,now=Date.now();if(!correct){st.box=0;st.dueAt=now+5*60*1000;return;}if(confidence==='hard'){st.dueAt=now+15*60*1000;if(s&&!s.requeuedIds.includes(q.id)){s.retryQueue.push(q.id);s.requeuedIds.push(q.id);}return;}if(confidence==='easy')st.box=Math.min(5,st.box+2);else st.box=Math.min(5,st.box+1);const days=confidence==='easy'?[1,3,7,14,30,60]:[1,2,4,8,16,30];st.dueAt=now+days[Math.max(0,Math.min(5,st.box-1))]*86400000;}
function setConfidence(qid,confidence){const s=state.activeSession;if(!s||!s.submitted[qid]||!s.submitted[qid].correct)return;const rec=s.submitted[qid];if(rec.confidenceApplied)return;rec.confidence=confidence;rec.confidenceApplied=true;updateSpacedSchedule(qById(qid),true,confidence,s.id);saveState();toast(confidence==='hard'?'Added for another pass later in this session.':'Review interval updated.');}
function ensureConfidence(qid){const s=state.activeSession,rec=s.submitted[qid];if(rec&&rec.correct&&!rec.confidenceApplied){rec.confidence='okay';rec.confidenceApplied=true;updateSpacedSchedule(qById(qid),true,'okay',s.id);}}
function handleQuizAction(action){const s=state.activeSession,q=currentQuestion();if(!s)return;switch(action){case'bookmark':{const st=getStats(q.id);st.bookmarked=!st.bookmarked;saveState();toast(st.bookmarked?'Question bookmarked':'Bookmark removed');render();break;}case'restart':showRestartModal();break;case'pause':state.quizOpen=false;saveState();page='practice';render();break;case'exit-quiz':state.quizOpen=false;saveState();page='practice';render();break;case'submit-answer':{if(s.submitted[q.id])return;const key=s.drafts[q.id];if(!key)return;const correct=recordAttempt(q,key,s.id,'okay');s.submitted[q.id]={selectedKey:key,correct,answeredAt:Date.now(),confidence:null,confidenceApplied:false};delete s.drafts[q.id];playFeedback(correct);saveState();render();break;}case'next-question':{ensureConfidence(q.id);advancePractice();break;}case'next-exam':if(s.currentIndex<s.queue.length-1){s.currentIndex++;saveState();render();}break;case'prev':if(s.currentIndex>0){s.currentIndex--;saveState();render();}break;case'finish-exam':finishExam();break;}}
function advancePractice(){const s=state.activeSession;if(!s)return;if(s.currentIndex<s.queue.length-1){s.currentIndex++;saveState();render();return;}if(s.retryQueue.length&&!s.retryExpanded){const retryIds=s.retryQueue.slice();s.queue.push(...retryIds);s.retryQueue=[];s.retryExpanded=true;retryIds.forEach(id=>{delete s.submitted[id];delete s.drafts[id];});s.currentIndex++;saveState();render();return;}completePractice();}
function completePractice(){const s=state.activeSession;if(!s)return;const attempts=s.practiceResults||[];const c=attempts.filter(x=>x.correct).length;const total=attempts.length;const result={mode:s.mode,correct:c,total,percentage:total?Math.round(c/total*100):0,finishedAt:Date.now(),startedAt:s.startedAt};state.history.unshift(result);state.history=state.history.slice(0,30);state.lastSessionResult={...result,show:true};state.activeSession=null;state.quizOpen=false;saveState();render();}
function finishExam(){const s=state.activeSession;if(!s||Object.keys(s.answers).length!==s.queue.length)return;let correct=0;const review=[];s.queue.forEach(id=>{const q=qById(id),key=s.answers[id],isCorrect=recordAttempt(q,key,s.id,'okay');if(isCorrect)correct++;review.push({id,selectedKey:key,correct:isCorrect,optionOrder:s.optionOrders[id]||LETTERS.slice()});});const result={mode:'exam',correct,total:s.queue.length,percentage:Math.round(correct/s.queue.length*100),finishedAt:Date.now(),startedAt:s.startedAt};state.history.unshift(result);state.history=state.history.slice(0,30);state.lastExam={...result,review,show:true};state.activeSession=null;state.quizOpen=false;saveState();render();}
function renderExamResult(){const r=state.lastExam;const wrong=r.review.filter(x=>!x.correct);return `<div class="page-head"><div><div class="eyebrow">EXAM COMPLETED</div><h1>Results and review</h1><p>Your answers are now unlocked. Review every question you missed.</p></div><span class="tiny-pill">${currentModeLabel('exam')}</span></div><section class="result-hero"><div><h2>${r.percentage>=80?'Strong performance.':r.percentage>=60?'Good progress.':'Keep building your recall.'}</h2><p>${r.correct} correct out of ${r.total} questions</p></div><div class="result-score">${r.percentage}<small>%</small></div></section><div class="stats-grid"><div class="stat-card"><div class="stat-top">Correct</div><div class="stat-value">${r.correct}</div></div><div class="stat-card"><div class="stat-top">Incorrect</div><div class="stat-value">${r.total-r.correct}</div></div><div class="stat-card"><div class="stat-top">Accuracy</div><div class="stat-value">${r.percentage}%</div></div><div class="stat-card"><div class="stat-top">To review</div><div class="stat-value">${wrong.length}</div></div></div><div class="section-row"><h2>Detailed answer review</h2><span>${wrong.length} incorrect · ${r.total-wrong.length} correct</span></div><div class="review-list">${r.review.map((item,i)=>renderReviewItem(item,i)).join('')}</div><div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:18px"><button class="btn" data-action="new-practice">Practice again ${icon('arrow')}</button><button class="btn secondary" data-action="close-result">Dashboard</button></div>`;}

function renderProgress(){const s=allAttemptCounts();const catRows=CATEGORIES.map((name,i)=>{const {m,tot}=catCounts(i);return `<div><div class="mini-row"><span>${esc(name)}</span><strong>${m}/${tot}</strong></div><div class="mini-bar"><i style="width:${m/tot*100}%"></i></div></div>`;}).join('');const allQ=QUESTIONS.concat(genItems().filter(q=>getStats(q.id).attempts||getStats(q.id).bookmarked));const difficult=allQ.filter(q=>getStats(q.id).isMistake||getStats(q.id).incorrect>getStats(q.id).correct).sort((a,b)=>getStats(b.id).incorrect-getStats(a.id).incorrect);const bookmarks=allQ.filter(q=>getStats(q.id).bookmarked);const upcoming=allQ.filter(q=>getStats(q.id).dueAt&&!isMastered(q.id)).sort((a,b)=>getStats(a.id).dueAt-getStats(b.id).dueAt).slice(0,6);return `<div class="page-head"><div><div class="eyebrow">YOUR LEARNING DATA</div><h1>Progress & mastery.</h1><p>See what's becoming reliable and what deserves another pass.</p></div><span class="tiny-pill">${icon('flame')} <b>${streakCount()}</b> day streak</span></div><div class="stats-grid"><div class="stat-card"><div class="stat-top">Questions mastered</div><div class="stat-value">${s.mastered}<small style="font-size:12px;color:#9aa4b1"> / ${s.total}</small></div></div><div class="stat-card"><div class="stat-top">Total attempts</div><div class="stat-value">${s.correct+s.incorrect}</div></div><div class="stat-card"><div class="stat-top">Accuracy</div><div class="stat-value">${s.accuracy}%</div></div><div class="stat-card"><div class="stat-top">Active mistakes</div><div class="stat-value">${s.mistakes}</div></div></div><div class="two-col"><section class="panel"><h3>Mastery by category</h3><p class="sub">A mastered question has three correct results in separate sessions.</p><div class="mini-list">${catRows}</div></section><section class="panel"><h3>Learning status</h3><p class="sub">Every question sits in one of these stages.</p><div class="mini-list"><div class="mini-row"><span>New</span><strong>${s.newCount}</strong></div><div class="mini-row"><span>Learning</span><strong>${s.learning}</strong></div><div class="mini-row"><span>Due for review</span><strong>${s.due}</strong></div><div class="mini-row"><span>Mastered</span><strong>${s.mastered}</strong></div></div></section></div><div class="section-row"><h2>Scheduled reviews</h2><span>${s.due} due now</span></div>${upcoming.length?`<div class="panel" style="display:grid;gap:12px">${upcoming.map(q=>`<div class="mini-row"><span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(qLabel(q))} · ${esc(q.text)}</span><strong style="white-space:nowrap;color:${isDue(q.id)?'var(--teal)':'var(--muted)'}">${formatDue(getStats(q.id).dueAt)}</strong></div>`).join('')}</div>`:'<div class="empty-state"><div class="empty-icon">'+icon('clock')+'</div><h3>No reviews scheduled yet</h3><p>Answer questions in Practice or Mastery mode to start building a review schedule.</p><button class="btn small" data-page="practice">Start practicing</button></div>'}<div class="section-row"><h2>Collections</h2><span>Saved for targeted practice</span></div><div class="two-col"><section class="panel"><h3>${icon('refresh')} Difficult questions <span class="tiny-pill">${difficult.length}</span></h3><p class="sub">Questions you have missed or struggled with.</p>${difficult.length?`<div class="mini-list">${difficult.slice(0,5).map(q=>`<div class="mini-row"><span>${esc(qLabel(q))} · ${esc(q.categoryName)}</span><strong>${getStats(q.id).incorrect} misses</strong></div>`).join('')}</div><button class="btn secondary small" style="margin-top:14px" data-mode-start="mistakes">Practice mistakes</button>`:'<p class="sub">No difficult questions yet.</p>'}</section><section class="panel"><h3>${icon('bookmark')} Bookmarks <span class="tiny-pill">${bookmarks.length}</span></h3><p class="sub">Questions you chose to save.</p>${bookmarks.length?`<div class="mini-list">${bookmarks.slice(0,5).map(q=>`<div class="mini-row"><span>${esc(qLabel(q))} · ${esc(q.categoryName)}</span><strong>Saved</strong></div>`).join('')}</div>`:'<p class="sub">Bookmark a question during a session to save it here.</p>'}</section></div><div class="section-row"><h2>Recent sessions</h2><span>Latest ${state.history.length}</span></div><div class="panel">${state.history.length?`<div class="mini-list">${state.history.slice(0,8).map(h=>`<div class="mini-row"><span>${esc(currentModeLabel(h.mode))} · ${formatDate(h.finishedAt)}</span><strong>${h.correct}/${h.total} · ${h.percentage}%</strong></div>`).join('')}</div>`:'<p class="sub" style="margin:0">Your completed sessions will appear here.</p>'}</div>`;}

utton class="btn secondary" data-action="import">Import progress JSON</button></div><p class="source-note" style="border:0;padding:0;margin-top:12px!important">This app has no server or account sync. Data is stored in this browser's localStorage. Browser privacy settings or file-origin behavior may limit persistence; use Export for a backup.</p></section><section class="panel" style="margin-top:13px;border-color:#f0d8d6"><h3 style="color:var(--red)">Reset learning progress</h3><p class="sub">Permanently clear saved answers, mastery status, schedules, bookmarks, streaks, and session history on this device. The 60-question source bank will remain unchanged.</p><button class="btn danger" data-action="reset">Reset all progress</button></section>`;}

function exportProgress(){const payload={app:'Knowledge Mastery Quiz',version:1,exportedAt:new Date().toISOString(),questionBankVersion:'source-60-v1',state,endless:E};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='knowledge-mastery-progress-'+todayKey()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Progress backup exported.');}
function importProgressFile(e){const file=e.target.files&&e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const payload=JSON.parse(reader.result);const incoming=payload.state||payload;if(!incoming||typeof incoming!=='object'||!incoming.progress||!incoming.prefs)throw new Error('Invalid backup');const valid={...cloneData(DEFAULT_STATE),...incoming,prefs:{...DEFAULT_STATE.prefs,...incoming.prefs},progress:incoming.progress||{},history:Array.isArray(incoming.history)?incoming.history:[],activityDays:Array.isArray(incoming.activityDays)?incoming.activityDays:[]};state=valid;saveState();if(payload.endless){try{E=normEndless(payload.endless);}catch(_){E=cloneData(E_DEFAULT);}E.active=null;eSummary=null;saveEndless();}toast('Progress restored from backup.');render();}catch(err){toast('That file is not a valid Knowledge Mastery backup.');}e.target.value='';};reader.readAsText(file);}

[0, 1, "An ambulance siren sounds higher-pitched as it approaches and lower as it moves away. Which phenomenon explains this?", "The Doppler effect", ["Sound refraction", "Acoustic resonance", "Wave diffraction"], "A moving source bunches its sound waves together in front (higher frequency) and spreads them out behind (lower frequency); this is the Doppler effect, also used in weather radar and in measuring galaxy speeds.", "Refraction is bending of waves between media, resonance is amplification at a natural frequency, and diffraction is waves spreading around obstacles; none of them depends on the source moving."],
[0, 1, "Fe del Mundo, a National Scientist of the Philippines, is best known for her work in which field?", "Pediatrics", ["Marine biology", "Nuclear physics", "Agricultural chemistry"], "Fe del Mundo founded the first pediatric hospital in the Philippines and is known for research on childhood diseases and for an improvised bamboo incubator for rural areas.", "Marine biology, nuclear physics and agricultural chemistry were not her field; her career was in children's medicine."],
[0, 1, "Nuclear power plants generate electricity mainly through which process?", "Nuclear fission", ["Nuclear fusion", "Chemical combustion", "Thermionic emission"], "Commercial reactors split heavy nuclei such as uranium-235 (fission); the heat released boils water to drive turbines.", "Fusion joins light nuclei and powers the Sun but is not yet used in commercial plants; combustion is a chemical reaction in fossil-fuel plants; thermionic emission is electrons leaving a hot surface."],
[0, 1, "Penicillin, the first widely used antibiotic, was discovered in 1928 by which scientist?", "Alexander Fleming", ["Louis Pasteur", "Joseph Lister", "Robert Koch"], "Alexander Fleming noticed that Penicillium mould killed bacteria on a culture plate; Florey and Chain later turned it into a mass-produced drug during World War II.", "Pasteur developed germ theory and early vaccines, Lister pioneered antiseptic surgery, and Koch identified the bacteria behind tuberculosis and cholera; none discovered penicillin."],
[0, 1, "Manny Pacquiao holds the record as the only boxer to win world titles in how many weight divisions?", "Eight", ["Six", "Seven", "Ten"], "Pacquiao won world titles in eight divisions, from flyweight to light middleweight, a record no other boxer has matched.", "Six and seven fall short of his record, and ten overstates it."],
[0, 1, "What is the boundary around a black hole beyond which nothing, not even light, can escape?", "The event horizon", ["The photon sphere", "The accretion disk", "The Roche limit"], "At the event horizon the escape velocity equals the speed of light, so no signal from inside can reach the outside.", "The photon sphere is a region outside the horizon where light can orbit, the accretion disk is infalling matter, and the Roche limit is the distance where tidal forces tear apart an orbiting body."],
[0, 1, "What does the 'S' in HTTPS indicate about a website connection?", "The data is encrypted in transit", ["The site is government-verified", "The page loads from a static server", "The server is located in-country"], "HTTPS means HTTP over TLS: data between the browser and the server is encrypted so it cannot be read or altered on the way.", "HTTPS does not mean a government checked the site, says nothing about static pages, and does not reveal where the server is located."],
[0, 1, "Lea Salonga won the 1991 Tony Award for Best Actress in a Musical for her role in which show?", "Miss Saigon", ["Les Misérables", "The King and I", "Flower Drum Song"], "Salonga originated the role of Kim in Miss Saigon in London and won the Tony when it opened on Broadway.", "She later played Éponine and Fantine in Les Misérables and starred in Flower Drum Song, but her Tony came for Miss Saigon; The King and I was not the source."],
[0, 1, "Insulin, the hormone that lowers blood sugar, is produced by which organ?", "The pancreas", ["The liver", "The thyroid", "The adrenal glands"], "Beta cells in the pancreas's islets of Langerhans make insulin; lack of insulin or resistance to it causes diabetes.", "The liver stores glucose, the thyroid regulates metabolism with thyroxine, and the adrenal glands make adrenaline and cortisol."],
[0, 1, "The Philippines lies on the Pacific 'Ring of Fire'. What mainly causes its frequent earthquakes and volcanoes?", "Plate subduction along trenches", ["Shifts in Earth's magnetic field", "Erosion of coastal limestone", "Heating from warm ocean currents"], "Oceanic plates sink beneath the Philippine Mobile Belt at trenches such as the Philippine Trench and Manila Trench; this builds stress (earthquakes) and melts rock (volcanoes).", "Magnetic field changes do not cause quakes, limestone erosion forms caves and sinkholes, and ocean currents affect weather, not tectonics."],
[0, 2, "Why do astronauts aboard the International Space Station experience weightlessness?", "They are in continuous free fall around Earth", ["Earth's gravity is absent at that altitude", "The station's spin cancels out gravity", "Air pressure in the station is too low"], "At about 400 km, gravity is still roughly 90% as strong as on the ground; the station and crew fall together around Earth fast enough to keep missing it, so they feel weightless.", "Gravity is not absent there, the ISS does not spin to cancel gravity, and air pressure has nothing to do with weight."],
[0, 2, "Edward Jenner's 1796 work, which led to the first vaccine, used material from which disease to protect against smallpox?", "Cowpox", ["Chickenpox", "Measles", "Rinderpest"], "Jenner inoculated a boy with cowpox and showed he was then protected from smallpox; the word vaccine comes from Latin vacca, cow.", "Chickenpox and measles are unrelated human viruses, and rinderpest is a cattle disease not used by Jenner."],
[0, 2, "Moore's Law, as revised by Gordon Moore in 1975, predicted that what would roughly double every two years?", "The number of transistors on a chip", ["The clock speed of each processor core", "The cost of computer memory", "The number of internet users"], "Moore observed that the number of transistors on an integrated circuit kept doubling, which drove decades of cheaper, faster computing.", "Clock speeds stopped rising quickly in the mid-2000s, memory costs fell rather than doubled, and internet users were not part of his prediction."],
[0, 2, "In machine learning, what does overfitting mean?", "The model fits training noise and fails on new data", ["The model is far too simple to capture the real pattern", "The dataset has more features than labels", "Training stops before the model converges"], "An overfitted model fits the training examples, including their noise, so closely that it generalises poorly; methods like validation sets and regularisation fight it.", "A model too simple to learn patterns is underfitting; many features or early stopping are separate issues (early stopping is actually a cure for overfitting)."],
[0, 2, "The 1991 eruption of Mount Pinatubo cooled global temperatures by about 0.5 °C for over a year. What caused this cooling?", "Sulfur aerosols reflected sunlight back to space", ["Ash blocked sunlight only over Luzon", "Lava flows absorbed atmospheric heat", "Released carbon dioxide trapped cold air near the ground"], "Pinatubo injected about 15 million tonnes of sulfur dioxide into the stratosphere, where it formed sulfate droplets that spread worldwide and reflected sunlight.", "Ash fell out within days and only regionally, lava does not cool the planet, and carbon dioxide warms rather than cools."],
[0, 2, "Hidilyn Diaz won the Philippines' first Olympic gold medal at Tokyo 2020 (held in 2021) in which event?", "Women's 55 kg weightlifting", ["Women's 49 kg weightlifting", "Women's 59 kg weightlifting", "Women's 64 kg weightlifting"], "Diaz lifted a total of 224 kg in the women's 55 kg category, setting an Olympic record and ending a 97-year wait for Philippine gold.", "The 49, 59 and 64 kg categories were other weight classes; her silver in 2016 was in the 53 kg class, and her gold was in 55 kg."],
[0, 2, "Abelardo Aguilar, a Filipino scientist, sent a soil sample from Iloilo that led to the discovery of which antibiotic?", "Erythromycin", ["Streptomycin", "Tetracycline", "Vancomycin"], "Eli Lilly isolated erythromycin from Saccharopolyspora erythraea in Aguilar's sample and first sold it as Ilosone, named after Iloilo.", "Streptomycin came from Selman Waksman's lab, tetracycline from Lederle's soil screening in the US, and vancomycin from a sample from Borneo."],
[0, 2, "Which immune cells produce antibodies?", "B lymphocytes", ["T lymphocytes", "Macrophages", "Neutrophils"], "Activated B lymphocytes become plasma cells that secrete antibodies matched to specific antigens.", "T cells coordinate or kill infected cells directly, and macrophages and neutrophils engulf microbes; none of them secretes antibodies."],
[0, 2, "Why does the Moon always show the same face to Earth?", "Its spin period matches its orbital period", ["It does not spin on its own axis at any time", "Earth's shadow hides its other side", "Its far side reflects no sunlight"], "Tidal locking slowed the Moon's spin until one rotation takes as long as one orbit (about 27.3 days), keeping the same side facing Earth.", "The Moon does rotate, once per orbit; Earth's shadow only causes eclipses; and the far side gets as much sunlight as the near side."],
[0, 2, "In Proof-of-Work blockchains such as Bitcoin, what must miners do to add a block?", "Spend computing power solving a hash puzzle", ["Lock up coins as a security deposit", "Get approval for each block from a central authority", "Store a copy of every user's wallet"], "Miners repeatedly hash block data until they find a value below the network target; the work makes rewriting history expensive.", "Locking coins as a deposit is Proof of Stake, a central authority is what blockchains avoid, and miners do not store users' wallets."],
[0, 2, "Gregor Mendel's pea plant experiments established which principle?", "Traits are inherited as discrete units", ["Acquired traits pass to offspring", "Species change by natural selection", "Genes are made of DNA"], "Mendel showed traits pass on as separate factors (later called genes) that segregate and assort in predictable ratios.", "Inheritance of acquired traits was Lamarck's idea, natural selection was Darwin's, and DNA was identified as genetic material in the 1940s and 1950s."],
[0, 2, "Why is Venus hotter than Mercury even though Venus is farther from the Sun?", "Its dense carbon dioxide atmosphere traps heat", ["It has more active volcanoes than any other planet", "Its slow rotation keeps one side sunlit", "Its core is larger and much hotter"], "Venus's thick CO2 atmosphere creates a runaway greenhouse effect, keeping its surface near 465 °C day and night.", "Volcanism and core heat are minor contributors, and slow rotation would make one side colder; yet Venus is evenly hot because of its atmosphere."],
[0, 2, "Caloy Loyzaga led the Philippines to its best-ever finish at the FIBA World Championship in 1954. What was that finish?", "Bronze medal (third place)", ["Gold medal (champion)", "Silver medal (runner-up)", "Fourth place"], "At the 1954 tournament in Rio de Janeiro the Philippines won bronze, still the best result by an Asian team at the event; Loyzaga made the All-Tournament team.", "The Philippines has never won gold or silver at the World Cup or World Championship, and fourth place understates the 1954 result."],
[0, 2, "Why are antibiotics not used to treat the common cold?", "Colds are caused by viruses, not bacteria", ["Cold germs form protective spores", "The body breaks antibiotics down too fast", "The cold virus hides inside the bones"], "Antibiotics target bacterial structures such as cell walls; cold viruses have none, so antibiotics do nothing and add to resistance.", "Cold viruses do not form spores or hide in bone, and antibiotics last long enough in the body to work against bacteria."],
[0, 2, "What is the main advantage of a solid-state drive (SSD) over a hard disk drive (HDD)?", "No moving parts, so much faster access", ["Lower cost per gigabyte", "Unlimited rewrite cycles for every cell", "Immunity to data corruption"], "SSDs read data from flash memory electronically instead of moving a head over spinning platters, so access is much faster.", "HDDs are still cheaper per gigabyte, flash cells wear out after many writes, and SSDs can still suffer data corruption."],
[0, 2, "Brillante Mendoza won Best Director at the 2009 Cannes Film Festival for which film?", "Kinatay", ["Serbis", "Ma' Rosa", "Lola"], "Mendoza won for Kinatay, the first Filipino Best Director win at Cannes.", "Serbis (2008) competed at Cannes but did not win; Ma' Rosa won Best Actress for Jaclyn Jose in 2016; Lola premiered at Venice."],
[0, 2, "Radiocarbon dating is reliable only for materials up to about 50,000 years old. Why?", "Too little carbon-14 remains to measure", ["Older samples absorb new carbon-14", "Carbon-14 turns into carbon-12 instantly", "Older fossils contain no carbon at all"], "Carbon-14 has a half-life of about 5,730 years; after roughly nine half-lives, so little is left that it can no longer be measured accurately.", "Contamination exists but is not the limit, carbon-14 decays to nitrogen-14 slowly, and old organic remains still contain carbon."],
[0, 2, "IBM's Deep Blue computer made history in 1997 by doing what?", "Beating world chess champion Garry Kasparov in a match", ["Winning the quiz show Jeopardy! against top champions", "Defeating the world Go champion Lee Sedol", "Passing the Turing test in a public trial"], "Deep Blue won a six-game rematch against Kasparov 3½–2½, the first defeat of a reigning world champion by a computer under match conditions.", "IBM's Watson won Jeopardy! in 2011, DeepMind's AlphaGo beat Lee Sedol in 2016, and passing the Turing test was never part of Deep Blue's achievement."],
[0, 3, "The Higgs boson, confirmed at CERN in 2012, is linked to which mechanism?", "Giving elementary particles their mass", ["Holding atomic nuclei together", "Carrying the electromagnetic force", "Causing radioactive beta decay"], "The Higgs field gives mass to W and Z bosons and fermions through their interaction with it; the boson is the field's detectable excitation.", "Gluons (strong force) hold nuclei together, photons carry electromagnetism, and the W boson mediates beta decay."],
[0, 3, "What problem does public-key cryptography solve that symmetric encryption alone cannot?", "Sharing keys safely over an insecure channel", ["Encrypting large files much faster", "Making ciphertext impossible to copy or forward", "Removing the need for any secret key"], "With a public/private key pair, strangers can set up a shared secret or verify signatures without ever meeting to exchange a key first.", "Symmetric ciphers are actually faster for bulk data, any ciphertext can be copied, and private keys must still be kept secret."],
[0, 3, "The Chandrasekhar limit, about 1.4 solar masses, sets which boundary?", "The maximum mass of a stable white dwarf", ["The minimum mass for a star to form", "The mass at which a planet becomes a star", "The largest mass a black hole can reach"], "Above about 1.4 solar masses, electron degeneracy pressure cannot hold up a white dwarf, so it collapses or explodes as a type Ia supernova.", "The minimum stellar mass is about 0.08 solar masses (hydrogen fusion limit), and black holes have no known upper limit."],
[0, 3, "How does CAR-T cell therapy differ from conventional chemotherapy?", "It engineers a patient's own T cells to attack cancer", ["It focuses radiation on a single tumour", "It cuts off the blood supply that feeds the tumour", "It replaces diseased bone marrow with donor cells"], "In CAR-T therapy, a patient's T cells are engineered to carry a chimeric antigen receptor that recognises a cancer marker, then infused back to hunt cancer cells.", "Focused radiation is radiotherapy, cutting off blood supply is anti-angiogenic therapy, and donor marrow is a stem cell transplant."],
[0, 3, "Shor's algorithm threatens RSA encryption because a large quantum computer could efficiently do what?", "Factor very large numbers into primes", ["Guess passwords by brute force", "Reverse any hash function instantly", "Intercept keys without being detected"], "RSA's security rests on how hard it is to factor the product of two large primes; Shor's algorithm factors in polynomial time on a quantum computer.", "Grover's algorithm only speeds up brute-force search quadratically, hash functions are not broken instantly, and undetected interception is not what Shor's algorithm does."],
[0, 3, "Alan Turing proved in 1936 that no general algorithm can do which task?", "Decide whether any program will eventually halt", ["Sort a list faster than any other method", "Translate between any two human languages perfectly", "Simulate the steps of another computer"], "The halting problem is undecidable: no program can correctly decide, for every program and input, whether it stops.", "Sorting and translation are practical problems with algorithms, and Turing's universal machine shows one computer can simulate another."],
[0, 3, "Palawan's wildlife resembles Borneo's more than the rest of the Philippines'. What best explains this?", "Lower ice-age seas linked it to the Sunda Shelf", ["Its soil came from Bornean volcanoes", "Migrating birds carried Bornean species across the sea", "Spanish traders brought Bornean animals"], "During glacial periods, lower sea levels joined Palawan more closely to Borneo and the Sunda Shelf; Huxley's line separates it from the rest of the archipelago.", "Volcanic soil does not carry fauna, birds cannot explain mammals like the Palawan pangolin, and the shared wildlife long predates Spanish trade."],
[0, 3, "In epidemiology, what does a basic reproduction number (R0) of 3 mean?", "Each case infects about three others when no one is immune", ["Three percent of all infected people die of it", "The outbreak triples in size every day until it peaks", "A patient stays infectious for three weeks"], "R0 is the average number of secondary cases one infected person causes when nobody is immune; above 1 an outbreak can grow.", "Death rate is the case fatality rate, daily growth depends on generation time as well, and infectious period is a separate measure."],
[0, 3, "What did the Michelson-Morley experiment of 1887 fail to detect, opening the way to special relativity?", "Earth's motion through a luminiferous aether", ["The bending of starlight by the Sun's gravity", "The particle nature of light", "The expansion of the universe"], "Light's speed came out the same in every direction, so there was no sign of the 'aether wind'; Einstein's 1905 theory made light's constant speed a principle.", "Light bending was confirmed in 1919, photons came from Einstein's 1905 work on the photoelectric effect, and expansion was found by Hubble in the 1920s."],
[0, 3, "Why do golf balls have dimples?", "They trip a turbulent layer that reduces drag", ["They add mass so the ball holds its line", "They reduce the ball's spin after impact", "They make the ball lighter overall"], "Dimples make the boundary layer turbulent, so air clings to the ball longer, the wake shrinks and drag drops; a smooth ball flies much shorter.", "Dimples barely change mass, they actually help backspin create lift, and their effect is aerodynamic, not about weight."],
[0, 3, "The 2017 Dengvaxia controversy in the Philippines followed which disclosure by the manufacturer?", "Higher risk of severe dengue in people never infected before", ["The vaccine contained an unapproved preservative", "Doses had been stored at the wrong temperature in clinics", "It protected against only one dengue serotype"], "Sanofi reported that people with no prior dengue infection who got the vaccine faced a higher risk of severe disease if later infected; the national school programme was halted.", "The issue was not a preservative or storage, and the vaccine was designed against all four serotypes."],
[0, 3, "In AI development, what does reinforcement learning from human feedback (RLHF) use human preferences for?", "Training a reward model to fine-tune outputs", ["Labelling images for pre-training", "Choosing the neural network's layer architecture", "Compressing the model for speed"], "People rank model outputs, a reward model learns those preferences, and reinforcement learning then tunes the model toward preferred answers.", "Image labelling is supervised learning, architecture choice is a design step, and compression (distillation or quantisation) is unrelated to RLHF."],
[1, 1, "How many senators sit in the Philippine Senate under the 1987 Constitution?", "24", ["12", "18", "30"], "Article VI, Section 2 sets 24 senators elected at large; half are elected every three years for six-year terms.", "12 is the number elected in each election, not the total; 18 and 30 match no Philippine Senate."],
[1, 1, "Who was elected the first President of the Commonwealth of the Philippines in 1935?", "Manuel L. Quezon", ["Sergio Osmeña", "Emilio Aguinaldo", "José P. Laurel"], "Quezon won the 1935 election and led the Commonwealth until his death in 1944.", "Osmeña was his vice president and successor, Aguinaldo lost the 1935 election, and Laurel led the Japanese-sponsored Second Republic."],
[1, 1, "The priests Gómez, Burgos and Zamora (Gomburza), executed in 1872, were accused of involvement in which event?", "The Cavite Mutiny", ["The Dagohoy revolt", "The Cry of Pugad Lawin", "The Battle of Mactan"], "The colonial government linked the three secular priests to the 1872 Cavite arsenal mutiny; their execution deeply influenced Rizal and the reform movement.", "Dagohoy's revolt was in Bohol (1744–1829), the Cry of Pugad Lawin came in 1896, and Mactan was in 1521."],
[1, 1, "A student skips a paid weekend job to study for an exam. In economics, the wages given up are called the:", "Opportunity cost", ["Sunk cost", "Marginal cost", "Fixed cost"], "Opportunity cost is the value of the next-best alternative given up when making a choice.", "A sunk cost is already spent and cannot be recovered, marginal cost is the cost of one more unit, and fixed costs do not change with output."],
[1, 1, "Which philosopher wrote The Republic, which describes a state ruled by philosopher-kings?", "Plato", ["Aristotle", "Socrates", "Epicurus"], "Plato's Republic, written as dialogues led by Socrates, argues that people trained in philosophy should rule.", "Aristotle wrote Politics, Socrates left no writings of his own, and Epicurus taught about pleasure and tranquillity."],
[1, 1, "Which body of water separates the Batanes Islands from Taiwan?", "The Bashi Channel", ["The Sibutu Passage", "The Mindoro Strait", "The Surigao Strait"], "The Bashi Channel, part of the Luzon Strait, lies between Batanes and Taiwan's Orchid Island.", "The Sibutu Passage is near Tawi-Tawi and Borneo, the Mindoro Strait lies between Mindoro and Palawan, and the Surigao Strait lies between Leyte and Mindanao."],
[1, 1, "Ivan Pavlov's dogs learned to salivate at the sound of a bell. Which type of learning does this show?", "Classical conditioning", ["Operant conditioning", "Observational learning", "Insight learning"], "A neutral stimulus (the bell) was paired with food until it alone triggered salivation: classical conditioning.", "Operant conditioning uses rewards and punishments for behaviour, observational learning comes from watching others, and insight learning is a sudden solution to a problem."],
[1, 1, "What did the Tydings-McDuffie Act of 1934 provide for the Philippines?", "A ten-year Commonwealth before independence", ["Immediate and full independence from the U.S.", "Admission as a U.S. state", "Permanent U.S. military rule"], "The act created the Commonwealth government (1935) with a ten-year transition to independence, which came on July 4, 1946.", "Independence was not immediate, statehood was never granted, and the act set up civilian self-government, not military rule."],
[1, 1, "Which 1967 document founded the Association of Southeast Asian Nations (ASEAN)?", "The Bangkok Declaration", ["The Manila Pact", "The Bali Concord", "The Jakarta Accord"], "Indonesia, Malaysia, the Philippines, Singapore and Thailand signed the ASEAN Declaration in Bangkok on August 8, 1967.", "The 1954 Manila Pact created SEATO, the Bali Concord (1976) came later, and there is no founding 'Jakarta Accord'."],
[1, 1, "In sociology, what does ethnocentrism mean?", "Judging other cultures by one's own standards", ["Studying cultures through fieldwork", "Believing all cultures are equally valid", "Fully adopting another culture's customs"], "Ethnocentrism treats one's own culture as the measure of what is normal or right.", "Fieldwork is ethnography, treating cultures as equally valid is cultural relativism, and adopting another culture's customs is assimilation."],
[1, 2, "In game theory, a Nash equilibrium is a situation in which:", "No player gains by changing strategy alone", ["All players reach the best possible total outcome", "One player dominates every other player", "Players agree to cooperate by contract"], "At a Nash equilibrium, each player's strategy is the best response to the others', so nobody benefits from switching unilaterally.", "The Prisoner's Dilemma shows an equilibrium need not be the best total outcome; domination and binding contracts are not part of the definition."],
[1, 2, "Antonio Gramsci's idea of cultural hegemony explains how a ruling class keeps power mainly through:", "Winning consent through shared ideas and values", ["Direct military force against rebels and critics", "Control of foreign trade routes", "Hereditary rights written into law"], "Gramsci argued that dominant groups rule largely by making their worldview seem like common sense through schools, media and religion.", "Force is what hegemony supplements rather than relies on, and trade routes and hereditary law are not his explanation."],
[1, 2, "Which principle is central to Immanuel Kant's categorical imperative?", "Act only on rules you could will as universal laws", ["Choose the act that brings the most happiness", "Build virtue by seeking the middle way", "Follow what your community thinks is right"], "Kant held that a moral rule must be one you could will everyone to follow, and that people must be treated as ends, never merely as means.", "Maximising happiness is utilitarianism, the middle way is Aristotle's virtue ethics, and community approval is cultural relativism."],
[1, 2, "Thomas Kuhn's term 'paradigm shift' describes what?", "A revolution that replaces a field's basic framework", ["Slow, steady addition of new facts to old theories", "Testing each theory by trying hard to falsify it", "Merging two rival theories into one"], "In The Structure of Scientific Revolutions (1962), Kuhn argued that science moves through crises that overturn whole frameworks, as when Copernican astronomy replaced the Ptolemaic system.", "Steady accumulation is what Kuhn called normal science, and falsification is Karl Popper's idea."],
[1, 2, "Why is the Malolos Republic of 1899 significant in Asian history?", "It is seen as Asia's first constitutional republic", ["It was the first absolute monarchy in all of Asia", "It was Asia's first communist state", "It was the first federal union of states in Asia"], "The First Philippine Republic, under the Malolos Constitution, is widely regarded as the first constitutional republic in Asia.", "It was a republic, not a monarchy; Asia's first communist state came with Mongolia in 1924; and the Malolos government was unitary, not federal."],
[1, 2, "During a recession, Keynesian economics recommends that governments:", "Raise spending or cut taxes to boost demand", ["Cut spending to balance the budget as fast as possible", "Let wages fall until markets clear", "Fix the money supply's growth rate"], "Keynes argued that weak overall demand causes unemployment, so government spending or tax cuts can restore output.", "Austerity in a slump is the opposite of Keynesian advice, waiting for wages to fall is the classical view, and a fixed money growth rule is monetarism."],
[1, 2, "Stagflation, seen during the 1970s oil crises, combines which conditions?", "High inflation with stagnant growth", ["Rapid growth with falling prices", "Low unemployment with deflation", "Rising wages with trade surpluses"], "Oil price shocks raised costs, pushing prices up while output stalled and unemployment rose, a mix that standard models had thought unlikely.", "The other pairs describe booms or deflation, not the combination of rising prices and a stagnant economy."],
[1, 2, "Under the 1987 Constitution, which action requires the concurrence of at least two-thirds of all Senators?", "Ratifying a treaty", ["Passing the national budget", "Confirming cabinet appointments", "Declaring a state of calamity"], "Article VII, Section 21 requires two-thirds of all Senators to concur before a treaty or international agreement takes effect.", "The budget passes by majority in both houses, cabinet members are confirmed by the Commission on Appointments, and a state of calamity is declared by the President."],
[1, 2, "Under the 1987 Constitution, which body has the sole power to try and decide impeachment cases?", "The Senate", ["The Ombudsman", "The Supreme Court", "The Sandiganbayan"], "The House of Representatives initiates impeachment, and the Senate tries and decides the case (Article XI, Section 3).", "The Ombudsman investigates officials, the Supreme Court's Chief Justice presides only when the President is tried, and the Sandiganbayan is an anti-graft court."],
[1, 2, "A smoker who knows smoking is harmful tells themselves that the risk is exaggerated. Which concept does this illustrate?", "Reducing cognitive dissonance", ["The placebo effect", "The bystander effect in groups", "Classical conditioning"], "Leon Festinger's theory says that conflicting beliefs and actions cause discomfort, which people ease by changing a belief or explaining it away.", "The placebo effect is improvement from an inactive treatment, the bystander effect is less helping in a crowd, and classical conditioning is learning by association."],
[1, 2, "In Filipino social psychology, 'utang na loob' is best described as:", "A lasting obligation from a debt of gratitude", ["Shame felt from breaking social rules", "Keeping smooth relations by avoiding conflict", "Leaving one's fate to divine will"], "Utang na loob is a debt of the inner self, owed to someone who did you a kindness and repaid through lasting loyalty and reciprocity.", "Shame is hiya, smooth relations is pakikisama, and leaving things to fate is bahala na."],
[1, 2, "Why is the 1955 Bandung Conference significant?", "It united Asian and African states and inspired Non-Alignment", ["It ended the Korean War with an armistice", "It created the Association of Southeast Asian Nations", "It divided Vietnam at the 17th parallel"], "Twenty-nine newly independent Asian and African countries met in Indonesia to oppose colonialism and Cold War pressure, laying the groundwork for the Non-Aligned Movement (1961).", "The Korean armistice was signed in 1953, ASEAN was founded in 1967, and Vietnam was divided by the 1954 Geneva Accords."],
[1, 2, "Simón Bolívar is called 'El Libertador' for leading independence in which region?", "Northern South America", ["Mexico and Central America", "The Caribbean islands", "The southern cone of South America"], "Bolívar led the liberation of Venezuela, Colombia, Ecuador, Peru and Bolivia, which is named after him.", "Mexico won independence under Hidalgo, Morelos and Iturbide; Haiti's revolution was led by Toussaint Louverture; and José de San Martín led the south."],
[1, 2, "The Berlin Conference of 1884–1885 is best known for:", "Setting rules for European claims in Africa", ["Ending the Franco-Prussian War with a treaty", "Unifying the German states", "Founding the League of Nations"], "European powers set terms for claiming African territory, speeding up the 'Scramble for Africa' without African representation.", "The Franco-Prussian War ended with the Treaty of Frankfurt (1871), Germany unified in 1871, and the League was founded in 1920."],
[1, 2, "'If it rains, the road gets wet. The road is wet, so it must have rained.' Which logical fallacy is this?", "Affirming the consequent", ["Denying the antecedent", "Ad hominem", "Circular reasoning"], "From 'if P then Q' and Q, you cannot conclude P; something else, such as a street cleaner, could have wet the road.", "Denying the antecedent reasons 'not P, so not Q'; ad hominem attacks a person; circular reasoning assumes its conclusion."],
[1, 2, "Thomas Hobbes argued that people accept an absolute sovereign mainly to escape what?", "A state of nature that is a war of all against all", ["The tyranny of the majority in elected assemblies", "Rule by a foreign power over their own homeland", "Control of the state by the church"], "In Leviathan (1651), Hobbes described life without government as 'solitary, poor, nasty, brutish, and short', so people trade freedom for security.", "Tyranny of the majority was a concern of Tocqueville and Mill, and Hobbes did not base his argument on foreign or church rule."],
