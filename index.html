const LETTERS=['A','B','C','D'];

const STORAGE_KEY='knowledgeMastery.quiz.v1';
const DEFAULT_STATE={version:1,prefs:{shuffleQuestions:false,shuffleAnswers:false,sound:false,haptics:false},progress:{},history:[],activityDays:[],activeSession:null,quizOpen:false,lastExam:null,lastSessionResult:null};

let toastTimer=null;

function cloneData(value){return typeof structuredClone==='function'?structuredClone(value):JSON.parse(JSON.stringify(value));}

function freshStats(){return {attempts:0,correct:0,incorrect:0,masterySessions:[],dueAt:null,box:0,isMistake:false,bookmarked:false,lastResult:null,lastAnsweredAt:null};}
function getStats(qid){if(!state.progress[qid])state.progress[qid]=freshStats();return state.progress[qid];}
function loadState(){try{const raw=localStorage.getItem(STORAGE_KEY);if(!raw)return cloneData(DEFAULT_STATE);const parsed=JSON.parse(raw);const s={...cloneData(DEFAULT_STATE),...parsed,prefs:{...DEFAULT_STATE.prefs,...(parsed.prefs||{})},progress:parsed.progress||{},history:Array.isArray(parsed.history)?parsed.history:[],activityDays:Array.isArray(parsed.activityDays)?parsed.activityDays:[]};return s;}catch(e){return cloneData(DEFAULT_STATE);}}
function saveState(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));storageWritable=true;const el=document.getElementById('save-status');if(el)el.textContent='Saved on this device';}catch(e){storageWritable=false;const el=document.getElementById('save-status');if(el)el.textContent='Session-only storage';}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function uid(){return 's'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function todayKey(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function formatDate(ts){return new Date(ts).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});}
function formatDue(ts){if(!ts)return 'Not scheduled';const diff=ts-Date.now();if(diff<=0)return 'Due now';if(diff<3600000)return 'In '+Math.ceil(diff/60000)+' min';if(diff<86400000)return 'In '+Math.ceil(diff/3600000)+' hr';return 'In '+Math.ceil(diff/86400000)+' days';}
function isMastered(qid){return getStats(qid).masterySessions.length>=3;}
function isDue(qid){const s=getStats(qid);return !!s.dueAt&&s.dueAt<=Date.now()&&!isMastered(qid);}
function allAttemptCounts(){let correct=0,incorrect=0,answered=0,mastered=0,due=0,mistakes=0,newCount=0,learning=0;QUESTIONS.forEach(q=>{const s=getStats(q.id);correct+=s.correct;incorrect+=s.incorrect;if(s.attempts)answered++;if(isMastered(q.id))mastered++;else if(s.attempts)learning++;else newCount++;if(isDue(q.id))due++;if(s.isMistake)mistakes++;});return {correct,incorrect,answered,mastered,due,mistakes,newCount,learning,remaining:QUESTIONS.length-mastered,accuracy:correct+incorrect?Math.round(correct/(correct+incorrect)*100):0};}
function recordActivity(){const k=todayKey();if(!state.activityDays.includes(k))state.activityDays.push(k);state.activityDays=state.activityDays.slice(-400);}
function streakCount(){const set=new Set(state.activityDays);let d=new Date();if(!set.has(todayKey()))d.setDate(d.getDate()-1);let n=0;while(set.has(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'))){n++;d.setDate(d.getDate()-1);}return n;}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2300);}

const NAV=[['home','Home'],['practice','Practice'],['progress','Progress'],['settings','Settings']];
function renderNav(){const html=NAV.map(([id,label])=>`<button class="nav-item ${page===id?'active':''}" data-page="${id}">${icon(id)}<span>${label}</span></button>`).join('');document.getElementById('side-nav').innerHTML=html;document.getElementById('bottom-nav').innerHTML=html;document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>{page=b.dataset.page;state.quizOpen=false;state.lastExam=null;state.lastSessionResult=null;saveState();render();}));}
function render(){renderNav();const main=document.getElementById('main');if(state.quizOpen&&state.activeSession){main.innerHTML=renderQuiz();bindQuiz();return;}if(state.lastExam&&state.lastExam.show){main.innerHTML=renderExamResult();bindExamResult();return;}if(state.lastSessionResult&&state.lastSessionResult.show){main.innerHTML=renderSessionResult();bindSessionResult();return;}if(page==='home')main.innerHTML=renderHome();else if(page==='practice')main.innerHTML=renderPractice();else if(page==='progress')main.innerHTML=renderProgress();else main.innerHTML=renderSettings();bindPage();}
function renderHome(){const s=allAttemptCounts();const cats=CATEGORIES.map((name,i)=>{const qs=QUESTIONS.filter(q=>q.category===i);const n=qs.filter(q=>isMastered(q.id)).length;return `<article class="category-card"><div class="category-top"><span class="category-index">0${i+1}</span><span class="tiny-pill">${n}/${qs.length}</span></div><h3>${esc(name)}</h3><p>${qs.length} questions · ${n===qs.length?'Completed':'Mastery in progress'}</p><div class="progress-track"><div class="progress-fill" style="width:${n/qs.length*100}%"></div></div><div class="progress-meta"><span>Mastered</span><strong>${Math.round(n/qs.length*100)}%</strong></div></article>`;}).join('');const continueBtn=state.activeSession?`<button class="btn" data-action="resume">Continue session ${icon('arrow')}</button>`:`<button class="btn" data-action="quick-start">Continue learning ${icon('arrow')}</button>`;return `<div class="page-head"><div><div class="eyebrow">YOUR LEARNING SPACE</div><h1>Knowledge, made lasting.</h1><p>A focused way to practice, revisit mistakes, and build real recall.</p></div><span class="tiny-pill">${icon('layers')} <b>60</b> questions</span></div>
<section class="hero"><div class="hero-copy"><div class="eyebrow">ONE SESSION AT A TIME</div><h2>Build knowledge that lasts.</h2><p>Practice with feedback, then return to questions at the right time. Mastery takes several correct reviews across separate sessions.</p>${continueBtn}</div><div class="hero-art">${icon('target')}</div></section>
<div class="stats-grid"><div class="stat-card"><div class="stat-top">Answered <span class="stat-icon">${icon('book')}</span></div><div class="stat-value">${s.answered}<small style="font-size:12px;color:#9aa4b1;font-weight:650"> / 60</small></div><div class="stat-foot">Unique questions attempted</div></div><div class="stat-card"><div class="stat-top">Accuracy <span class="stat-icon">${icon('target')}</span></div><div class="stat-value">${s.accuracy}%</div><div class="stat-foot">${s.correct} correct · ${s.incorrect} incorrect attempts</div></div><div class="stat-card"><div class="stat-top">Mastered <span class="stat-icon">${icon('check')}</span></div><div class="stat-value">${s.mastered}</div><div class="stat-foot">Correct across 3+ sessions</div></div><div class="stat-card"><div class="stat-top">Review due <span class="stat-icon">${icon('clock')}</span></div><div class="stat-value">${s.due}</div><div class="stat-foot">Ready for spaced review · ${s.mistakes} active mistakes</div></div></div>
<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 2px 8px;font-size:11px;color:var(--muted)"><strong style="color:var(--ink)">Learning progress</strong><span>${s.mastered}/60 mastered · ${s.remaining} remaining</span></div><div class="progress-track" style="margin:0 2px 20px;height:8px"><div class="progress-fill" style="width:${s.mastered/60*100}%"></div></div><div class="section-row"><h2>Category mastery</h2><span>Correct in 3 separate sessions to master</span></div><div class="category-grid">${cats}</div>
<div class="two-col"><section><div class="section-row"><h2>Learning overview</h2><span>All 60 questions</span></div><div class="panel"><div class="mini-list"><div><div class="mini-row"><span>New questions</span><strong>${s.newCount}</strong></div><div class="mini-bar"><i style="width:${s.newCount/60*100}%"></i></div></div><div><div class="mini-row"><span>Learning</span><strong>${s.learning}</strong></div><div class="mini-bar"><i style="width:${s.learning/60*100}%"></i></div></div><div><div class="mini-row"><span>Mastered</span><strong>${s.mastered}</strong></div><div class="mini-bar"><i style="width:${s.mastered/60*100}%"></i></div></div></div></div></section><section><div class="section-row"><h2>Your rhythm</h2><span>Consistency</span></div><div class="panel" style="height:calc(100% - 38px);display:flex;flex-direction:column;justify-content:space-between"><div><div style="display:flex;align-items:center;gap:9px;color:#d18a21;font-weight:800;font-size:24px">${icon('flame')} ${streakCount()} <span style="font-size:12px;color:var(--muted);font-weight:650">day streak</span></div><p class="sub" style="margin-top:8px">A learning day is recorded whenever you answer a question.</p></div><button class="btn secondary full" data-page="progress">View progress ${icon('arrow')}</button></div></section></div><p class="footer-note">Your learning data stays in this browser on this device. Export a backup in Settings.</p>`;}
function renderPractice(){const counts=allAttemptCounts();return `<div class="page-head"><div><div class="eyebrow">CHOOSE HOW TO LEARN</div><h1>Practice with purpose.</h1><p>Pick a mode, narrow the question set, and start a focused session.</p></div>${state.activeSession?'<button class="btn secondary small" data-action="resume">Resume session</button>':''}</div>
<div class="mode-grid"><button class="mode-card" data-mode="practice"><span class="mode-icon">${icon('book')}</span><span><strong>Practice mode</strong><small>Immediate feedback, no timer. Learn as you go.</small></span></button><button class="mode-card" data-mode="exam"><span class="mode-icon">${icon('target')}</span><span><strong>Exam mode</strong><small>Answer everything first. Review results at the end.</small></span></button><button class="mode-card" data-mode="mistakes"><span class="mode-icon">${icon('refresh')}</span><span><strong>Mistake review</strong><small>Retry missed questions until you demonstrate mastery.</small><small style="color:var(--red);margin-top:5px">${counts.mistakes} active questions</small></span></button><button class="mode-card" data-mode="spaced"><span class="mode-icon">${icon('clock')}</span><span><strong>Spaced repetition</strong><small>Prioritize questions scheduled for review.</small><small style="color:var(--teal);margin-top:5px">${counts.due} due now</small></span></button><button class="mode-card" data-mode="mastery"><span class="mode-icon">${icon('star')}</span><span><strong>Mastery mode</strong><small>Work on questions not yet mastered.</small><small style="color:var(--brand);margin-top:5px">${counts.remaining} remaining</small></span></button></div>
<section class="panel setup-panel"><div class="section-row" style="margin:0 0 14px"><h2>Session setup</h2><span id="available-count">60 available</span></div><div class="form-grid"><div class="field"><label for="setup-category">CATEGORY</label><select id="setup-category"><option value="all">All categories</option>${CATEGORIES.map((c,i)=>`<option value="${i}">${esc(c)}</option>`).join('')}</select></div><div class="field"><label for="setup-filter">QUESTION SET</label><select id="setup-filter"><option value="all">All questions</option><option value="unanswered">Unanswered only</option><option value="incorrect">Active mistakes</option><option value="due">Due for review</option><option value="unmastered">Not yet mastered</option></select></div><div class="field"><label for="setup-count">QUESTION COUNT</label><input type="number" id="setup-count" min="1" max="60" value="15" inputmode="numeric"></div></div><div class="setup-bottom"><div style="display:flex;gap:15px;flex-wrap:wrap"><label class="checkline"><input type="checkbox" id="setup-shuffle-q" ${state.prefs.shuffleQuestions?'checked':''}> Shuffle questions</label><label class="checkline"><input type="checkbox" id="setup-shuffle-a" ${state.prefs.shuffleAnswers?'checked':''}> Shuffle answer choices</label></div><button class="btn" data-action="start-setup">Start ${icon('arrow')}</button></div><p class="sub" id="setup-hint" style="margin:11px 0 0">Choose a category or question set. Question count is capped to the available questions.</p></section>
<div class="section-row"><h2>How mastery works</h2><span>Leitner-style review</span></div><div class="panel"><p class="sub" style="margin:0">A question becomes <b>mastered</b> only after three correct answers in three separate sessions. An incorrect answer resets its mastery streak and adds it to Mistake Review. Correct answers that feel difficult return later in the same session; review intervals grow as confidence improves.</p></div>`;}
function getSelectedModeFilter(mode){if(mode==='mistakes')return'incorrect';if(mode==='spaced')return'due';if(mode==='mastery')return'unmastered';return'all';}
function getPool(category,filter){return QUESTIONS.filter(q=>(category==='all'||q.category===Number(category))&&(filter==='all'||(filter==='unanswered'&&getStats(q.id).attempts===0)||(filter==='incorrect'&&getStats(q.id).isMistake)||(filter==='due'&&isDue(q.id))||(filter==='unmastered'&&!isMastered(q.id))));}
function updateSetupAvailability(){const cat=document.getElementById('setup-category'),filter=document.getElementById('setup-filter'),count=document.getElementById('setup-count'),label=document.getElementById('available-count');if(!cat||!filter||!count)return;const pool=getPool(cat.value,filter.value);label.textContent=pool.length+' available';count.max=Math.max(1,pool.length);if(Number(count.value)>pool.length)count.value=pool.length||1;const hint=document.getElementById('setup-hint');if(hint)hint.textContent=pool.length?`Up to ${pool.length} question${pool.length===1?'':'s'} match this selection.`:'No questions match this selection yet. Try another category or question set.';}
function startSession(mode,category,filter,count){page='practice';const pool=getPool(category,filter);if(!pool.length){toast('No questions match this selection yet.');return;}const amount=Math.max(1,Math.min(pool.length,Number(count)||pool.length));let selected=pool.slice();if(state.prefs.shuffleQuestions)selected=shuffle(selected);selected=selected.slice(0,amount);const optionOrders={};selected.forEach(q=>{let keys=LETTERS.slice();if(state.prefs.shuffleAnswers)keys=shuffle(keys);optionOrders[q.id]=keys;});state.activeSession={id:uid(),mode,category,filter,count:amount,queue:selected.map(q=>q.id),currentIndex:0,optionOrders,answers:{},drafts:{},submitted:{},retryQueue:[],requeuedIds:[],retryExpanded:false,practiceResults:[],startedAt:Date.now(),finished:false};state.quizOpen=true;state.lastExam=null;state.lastSessionResult=null;saveState();render();}
function qById(id){return QUESTIONS.find(q=>q.id===id);}
function currentQuestion(){const s=state.activeSession;return s&&qById(s.queue[s.currentIndex]);}
function currentOptionOrder(qid){const s=state.activeSession;return (s.optionOrders[qid]||LETTERS).slice();}
function displayLabel(qid,key){return LETTERS[currentOptionOrder(qid).indexOf(key)]||key;}
function currentModeLabel(mode){return ({practice:'Practice mode',exam:'Exam mode',mistakes:'Mistake review',spaced:'Spaced repetition',mastery:'Mastery mode'})[mode]||'Practice';}
function renderQuiz(){const s=state.activeSession,q=currentQuestion();if(!q)return '<div class="empty-state"><h3>No question found</h3><button class="btn" data-action="exit-quiz">Back to Practice</button></div>';const idx=s.currentIndex+1,total=s.queue.length,progress=Math.round((idx-1)/total*100);const isExam=s.mode==='exam';const submitted=!!s.submitted[q.id];const selected=isExam?s.answers[q.id]:(submitted?s.submitted[q.id].selectedKey:s.drafts[q.id]);const order=currentOptionOrder(q.id);const options=order.map((key,i)=>{const opt=q.options.find(o=>o.key===key);let cls='';if(selected===key&&!submitted)cls='selected';if(submitted&&s.submitted[q.id].correct&&key===q.correctKey)cls='correct';if(submitted&&!s.submitted[q.id].correct&&key===s.submitted[q.id].selectedKey)cls='incorrect';if(submitted&&!s.submitted[q.id].correct&&key===q.correctKey)cls='correct';return `<button class="answer-option ${cls}" data-answer="${key}" ${submitted&&!isExam?'disabled':''}><span class="letter">${LETTERS[i]}</span><span>${esc(opt.text)}</span></button>`;}).join('');let feedback='';if(submitted&&!isExam){const rec=s.submitted[q.id],correctText=q.options.find(o=>o.key===q.correctKey).text;feedback=`<div class="feedback ${rec.correct?'correct':'incorrect'}"><div class="feedback-head"><span>${rec.correct?'✓':'!'}</span>${rec.correct?'Correct!':'Incorrect!'}</div>${rec.correct?'<p>You selected the correct answer.</p>':`<p>Your selected answer was <b>${esc(q.options.find(o=>o.key===rec.selectedKey).text)}</b>. The correct answer is:</p>`}<div class="answer-reveal">${displayLabel(q.id,q.correctKey)}. ${esc(correctText)}</div><p class="source-note">No written explanation was included with this question in the supplied source bank. The original question and answer key are preserved without adding an unsupported explanation.</p>${rec.correct?`<div class="confidence"><span>How confident were you?</span><button data-confidence="hard" class="${rec.confidence==='hard'?'chosen':''}">Difficult</button><button data-confidence="okay" class="${rec.confidence==='okay'?'chosen':''}">Okay</button><button data-confidence="easy" class="${rec.confidence==='easy'?'chosen':''}">Confident</button></div>`:''}</div>`;}
const done=Object.keys(s.answers).length;let examControls='';if(isExam){examControls=`<p class="exam-progress-text">${done} of ${total} answered · You can change answers until you submit the exam.</p><div class="exam-picker">${s.queue.map((id,i)=>`<button class="exam-dot ${s.answers[id]?'answered':''} ${i===s.currentIndex?'current':''}" data-goto="${i}" title="Question ${i+1}${s.answers[id]?' answered':''}">${i+1}</button>`).join('')}</div>`;}
const qTools=`<div class="quiz-tools"><button class="btn ghost small" data-action="bookmark" title="Bookmark this question">${icon('bookmark')} ${getStats(q.id).bookmarked?'Saved':'Save'}</button><button class="btn ghost small" data-action="restart" title="Restart this session">${icon('refresh')} Restart</button><button class="btn ghost small" data-action="pause">Exit</button></div>`;
let actions='';if(isExam){actions=`<div class="quiz-actions"><button class="btn secondary" data-action="prev" ${s.currentIndex===0?'disabled':''}>Previous</button>${s.currentIndex<total-1?`<button class="btn" data-action="next-exam">Next ${icon('arrow')}</button>`:`<button class="btn" data-action="finish-exam" ${done!==total?'disabled':''}>Submit exam</button>`}</div>`;}else if(!submitted){actions=`<div class="quiz-actions"><span class="muted" style="font-size:10px">Choose one answer</span><button class="btn" data-action="submit-answer" ${selected?'':'disabled'}>Submit answer ${icon('arrow')}</button></div>`;}else{actions=`<div class="quiz-actions"><button class="btn secondary" data-action="pause">Exit session</button><button class="btn" data-action="next-question">${s.currentIndex===total-1&&s.retryQueue.length===0?'Finish session':'Next question'} ${icon('arrow')}</button></div>`;}
return `<div class="quiz-top"><button class="back-link" data-action="pause">← ${currentModeLabel(s.mode)}</button>${qTools}</div><div class="quiz-progress"><i style="width:${Math.max(4,progress)}%"></i></div><article class="question-card"><div class="question-meta"><span class="category-tag">${esc(q.categoryName)}</span><span class="q-number">QUESTION ${q.number} · ${idx} OF ${total}</span></div><h2 class="question-text">${esc(q.text)}</h2>${examControls}<div class="answers">${options}</div>${feedback}${actions}</article><p class="footer-note">${isExam?'Exam mode · Feedback and correct answers appear after submission.':'Practice mode · Review the answer before moving on.'} ${state.prefs.shuffleAnswers?'Answer choices may be shuffled.':''} Desktop shortcut: 1–4 select, Enter submit/advance.</p>`;}
function bindQuiz(){const s=state.activeSession,q=currentQuestion();if(!s||!q)return;document.querySelectorAll('[data-answer]').forEach(b=>b.addEventListener('click',()=>{if(s.mode==='exam'){s.answers[q.id]=b.dataset.answer;}else if(!s.submitted[q.id]){s.drafts[q.id]=b.dataset.answer;}saveState();render();}));document.querySelectorAll('[data-confidence]').forEach(b=>b.addEventListener('click',()=>{setConfidence(q.id,b.dataset.confidence);render();}));document.querySelectorAll('[data-goto]').forEach(b=>b.addEventListener('click',()=>{s.currentIndex=Number(b.dataset.goto);saveState();render();}));document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>handleQuizAction(b.dataset.action)));}
function playFeedback(correct){if(state.prefs.sound){try{const AudioContext=window.AudioContext||window.webkitAudioContext;if(AudioContext){const ctx=new AudioContext();const osc=ctx.createOscillator(),gain=ctx.createGain();osc.type='sine';osc.frequency.value=correct?660:220;gain.gain.value=.04;osc.connect(gain);gain.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+.11);osc.onended=()=>ctx.close();}}catch(e){}}if(state.prefs.haptics&&navigator.vibrate)navigator.vibrate(correct?35:[35,35,35]);}
function recordAttempt(q,selectedKey,sessionId,confidence){const stats=getStats(q.id);const correct=selectedKey===q.correctKey;if(state.activeSession&&state.activeSession.mode!=='exam')state.activeSession.practiceResults.push({id:q.id,correct,selectedKey,at:Date.now()});stats.attempts++;if(correct)stats.correct++;else stats.incorrect++;stats.lastResult=correct?'correct':'incorrect';stats.lastAnsweredAt=Date.now();if(correct){if(!stats.masterySessions.includes(sessionId))stats.masterySessions.push(sessionId);stats.masterySessions=stats.masterySessions.slice(-5);if(stats.masterySessions.length>=3)stats.isMistake=false;}else{stats.masterySessions=[];stats.isMistake=true;}recordActivity();if(!correct)updateSpacedSchedule(q,false,confidence,sessionId);else if(state.activeSession&&state.activeSession.mode==='exam')updateSpacedSchedule(q,true,'okay',sessionId);return correct;}
function updateSpacedSchedule(q,correct,confidence,sessionId){const st=getStats(q.id),s=state.activeSession,now=Date.now();if(!correct){st.box=0;st.dueAt=now+5*60*1000;return;}if(confidence==='hard'){st.dueAt=now+15*60*1000;if(s&&!s.requeuedIds.includes(q.id)){s.retryQueue.push(q.id);s.requeuedIds.push(q.id);}return;}if(confidence==='easy')st.box=Math.min(5,st.box+2);else st.box=Math.min(5,st.box+1);const days=confidence==='easy'?[1,3,7,14,30,60]:[1,2,4,8,16,30];st.dueAt=now+days[Math.max(0,Math.min(5,st.box-1))]*86400000;}
function setConfidence(qid,confidence){const s=state.activeSession;if(!s||!s.submitted[qid]||!s.submitted[qid].correct)return;const rec=s.submitted[qid];if(rec.confidenceApplied)return;rec.confidence=confidence;rec.confidenceApplied=true;updateSpacedSchedule(qById(qid),true,confidence,s.id);saveState();toast(confidence==='hard'?'Added for another pass later in this session.':'Review interval updated.');}
function ensureConfidence(qid){const s=state.activeSession,rec=s.submitted[qid];if(rec&&rec.correct&&!rec.confidenceApplied){rec.confidence='okay';rec.confidenceApplied=true;updateSpacedSchedule(qById(qid),true,'okay',s.id);}}
function handleQuizAction(action){const s=state.activeSession,q=currentQuestion();if(!s)return;switch(action){case'bookmark':{const st=getStats(q.id);st.bookmarked=!st.bookmarked;saveState();toast(st.bookmarked?'Question bookmarked':'Bookmark removed');render();break;}case'restart':showRestartModal();break;case'pause':state.quizOpen=false;saveState();page='practice';render();break;case'exit-quiz':state.quizOpen=false;saveState();page='practice';render();break;case'submit-answer':{if(s.submitted[q.id])return;const key=s.drafts[q.id];if(!key)return;const correct=recordAttempt(q,key,s.id,'okay');s.submitted[q.id]={selectedKey:key,correct,answeredAt:Date.now(),confidence:null,confidenceApplied:false};delete s.drafts[q.id];playFeedback(correct);saveState();render();break;}case'next-question':{ensureConfidence(q.id);advancePractice();break;}case'next-exam':if(s.currentIndex<s.queue.length-1){s.currentIndex++;saveState();render();}break;case'prev':if(s.currentIndex>0){s.currentIndex--;saveState();render();}break;case'finish-exam':finishExam();break;}}
function advancePractice(){const s=state.activeSession;if(!s)return;if(s.currentIndex<s.queue.length-1){s.currentIndex++;saveState();render();return;}if(s.retryQueue.length&&!s.retryExpanded){const retryIds=s.retryQueue.slice();s.queue.push(...retryIds);s.retryQueue=[];s.retryExpanded=true;retryIds.forEach(id=>{delete s.submitted[id];delete s.drafts[id];});s.currentIndex++;saveState();render();return;}completePractice();}
function completePractice(){const s=state.activeSession;if(!s)return;const attempts=s.practiceResults||[];const c=attempts.filter(x=>x.correct).length;const total=attempts.length;const result={mode:s.mode,correct:c,total,percentage:total?Math.round(c/total*100):0,finishedAt:Date.now(),startedAt:s.startedAt};state.history.unshift(result);state.history=state.history.slice(0,30);state.lastSessionResult={...result,show:true};state.activeSession=null;state.quizOpen=false;saveState();render();}
function finishExam(){const s=state.activeSession;if(!s||Object.keys(s.answers).length!==s.queue.length)return;let correct=0;const review=[];s.queue.forEach(id=>{const q=qById(id),key=s.answers[id],isCorrect=recordAttempt(q,key,s.id,'okay');if(isCorrect)correct++;review.push({id,selectedKey:key,correct:isCorrect,optionOrder:s.optionOrders[id]||LETTERS.slice()});});const result={mode:'exam',correct,total:s.queue.length,percentage:Math.round(correct/s.queue.length*100),finishedAt:Date.now(),startedAt:s.startedAt};state.history.unshift(result);state.history=state.history.slice(0,30);state.lastExam={...result,review,show:true};state.activeSession=null;state.quizOpen=false;saveState();render();}
function renderExamResult(){const r=state.lastExam;const wrong=r.review.filter(x=>!x.correct);return `<div class="page-head"><div><div class="eyebrow">EXAM COMPLETED</div><h1>Results and review</h1><p>Your answers are now unlocked. Review every question you missed.</p></div><span class="tiny-pill">${currentModeLabel('exam')}</span></div><section class="result-hero"><div><h2>${r.percentage>=80?'Strong performance.':r.percentage>=60?'Good progress.':'Keep building your recall.'}</h2><p>${r.correct} correct out of ${r.total} questions</p></div><div class="result-score">${r.percentage}<small>%</small></div></section><div class="stats-grid"><div class="stat-card"><div class="stat-top">Correct</div><div class="stat-value">${r.correct}</div></div><div class="stat-card"><div class="stat-top">Incorrect</div><div class="stat-value">${r.total-r.correct}</div></div><div class="stat-card"><div class="stat-top">Accuracy</div><div class="stat-value">${r.percentage}%</div></div><div class="stat-card"><div class="stat-top">To review</div><div class="stat-value">${wrong.length}</div></div></div><div class="section-row"><h2>Detailed answer review</h2><span>${wrong.length} incorrect · ${r.total-wrong.length} correct</span></div><div class="review-list">${r.review.map((item,i)=>renderReviewItem(item,i)).join('')}</div><div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:18px"><button class="btn" data-action="new-practice">Practice again ${icon('arrow')}</button><button class="btn secondary" data-action="close-result">Dashboard</button></div>`;}
function renderReviewItem(item,index){const q=qById(item.id),order=item.optionOrder||LETTERS,selected=q.options.find(o=>o.key===item.selectedKey),correct=q.options.find(o=>o.key===q.correctKey);return `<article class="review-item"><div class="question-meta" style="margin:0"><span class="category-tag">${esc(q.categoryName)}</span><span class="q-number">QUESTION ${q.number}</span></div><h4>${esc(q.text)}</h4><div class="review-line ${item.correct?'right':'wrong'}"><strong>${item.correct?'Correct':'Incorrect'}</strong>${item.correct?' · ':' · Your answer: '}${esc(selected.text)}</div>${!item.correct?`<div class="review-line right"><strong>Correct answer:</strong> ${LETTERS[order.indexOf(q.correctKey)]}. ${esc(correct.text)}</div>`:''}<div class="review-options">${order.map((key,i)=>{const opt=q.options.find(o=>o.key===key);return `<div class="review-option ${key===q.correctKey?'is-right':''} ${key===item.selectedKey&&!item.correct?'is-wrong':''}">${LETTERS[i]}. ${esc(opt.text)}${key===q.correctKey?' ✓':''}</div>`;}).join('')}</div><p class="source-note">No written explanation was supplied for this question in the original bank. No explanation has been invented.</p></article>`;}
function bindExamResult(){document.querySelectorAll('[data-action="new-practice"]').forEach(b=>b.addEventListener('click',()=>{state.lastExam=null;page='practice';startSession('practice','all','all',15);}));document.querySelectorAll('[data-action="close-result"]').forEach(b=>b.addEventListener('click',()=>{state.lastExam=null;page='home';saveState();render();}));}
function renderSessionResult(){const r=state.lastSessionResult;return `<div class="page-head"><div><div class="eyebrow">SESSION COMPLETE</div><h1>Nice work showing up.</h1><p>Every review is another retrieval opportunity.</p></div></div><section class="result-hero"><div><h2>${r.correct} correct out of ${r.total}</h2><p>${currentModeLabel(r.mode)} · ${formatDate(r.finishedAt)}</p></div><div class="result-score">${r.percentage}<small>%</small></div></section><div class="section-row"><h2>Keep the momentum</h2><span>Choose your next step</span></div><div class="mode-grid"><button class="mode-card" data-action="again-practice"><span class="mode-icon">${icon('book')}</span><span><strong>Practice more</strong><small>Continue learning across categories.</small></span></button><button class="mode-card" data-action="due-next"><span class="mode-icon">${icon('clock')}</span><span><strong>Review due questions</strong><small>Revisit questions scheduled for now.</small></span></button></div><div style="margin-top:16px"><button class="btn secondary" data-action="close-session-result">Back to dashboard</button></div>`;}
function bindSessionResult(){document.querySelectorAll('[data-action="again-practice"]').forEach(b=>b.addEventListener('click',()=>{state.lastSessionResult=null;page='practice';startSession('practice','all','all',15);}));document.querySelectorAll('[data-action="due-next"]').forEach(b=>b.addEventListener('click',()=>{state.lastSessionResult=null;startSession('spaced','all','due',60);}));document.querySelectorAll('[data-action="close-session-result"]').forEach(b=>b.addEventListener('click',()=>{state.lastSessionResult=null;page='home';saveState();render();}));}
function renderProgress(){const s=allAttemptCounts();const catRows=CATEGORIES.map((name,i)=>{const qs=QUESTIONS.filter(q=>q.category===i),m=qs.filter(q=>isMastered(q.id)).length;return `<div><div class="mini-row"><span>${esc(name)}</span><strong>${m}/${qs.length}</strong></div><div class="mini-bar"><i style="width:${m/qs.length*100}%"></i></div></div>`;}).join('');const difficult=QUESTIONS.filter(q=>getStats(q.id).isMistake||getStats(q.id).incorrect>getStats(q.id).correct).sort((a,b)=>getStats(b.id).incorrect-getStats(a.id).incorrect);const bookmarks=QUESTIONS.filter(q=>getStats(q.id).bookmarked);const upcoming=QUESTIONS.filter(q=>getStats(q.id).dueAt&&!isMastered(q.id)).sort((a,b)=>getStats(a.id).dueAt-getStats(b.id).dueAt).slice(0,6);return `<div class="page-head"><div><div class="eyebrow">YOUR LEARNING DATA</div><h1>Progress & mastery.</h1><p>See what's becoming reliable and what deserves another pass.</p></div><span class="tiny-pill">${icon('flame')} <b>${streakCount()}</b> day streak</span></div><div class="stats-grid"><div class="stat-card"><div class="stat-top">Questions mastered</div><div class="stat-value">${s.mastered}<small style="font-size:12px;color:#9aa4b1"> / 60</small></div></div><div class="stat-card"><div class="stat-top">Total attempts</div><div class="stat-value">${s.correct+s.incorrect}</div></div><div class="stat-card"><div class="stat-top">Accuracy</div><div class="stat-value">${s.accuracy}%</div></div><div class="stat-card"><div class="stat-top">Active mistakes</div><div class="stat-value">${s.mistakes}</div></div></div><div class="two-col"><section class="panel"><h3>Mastery by category</h3><p class="sub">A mastered question has three correct results in separate sessions.</p><div class="mini-list">${catRows}</div></section><section class="panel"><h3>Learning status</h3><p class="sub">Every question sits in one of these stages.</p><div class="mini-list"><div class="mini-row"><span>New</span><strong>${s.newCount}</strong></div><div class="mini-row"><span>Learning</span><strong>${s.learning}</strong></div><div class="mini-row"><span>Due for review</span><strong>${s.due}</strong></div><div class="mini-row"><span>Mastered</span><strong>${s.mastered}</strong></div></div></section></div><div class="section-row"><h2>Scheduled reviews</h2><span>${s.due} due now</span></div>${upcoming.length?`<div class="panel" style="display:grid;gap:12px">${upcoming.map(q=>`<div class="mini-row"><span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">Q${q.number} · ${esc(q.text)}</span><strong style="white-space:nowrap;color:${isDue(q.id)?'var(--teal)':'var(--muted)'}">${formatDue(getStats(q.id).dueAt)}</strong></div>`).join('')}</div>`:'<div class="empty-state"><div class="empty-icon">◷</div><h3>No reviews scheduled yet</h3><p>Answer questions in Practice or Mastery mode to start building a review schedule.</p><button class="btn small" data-page="practice">Start practicing</button></div>'}<div class="section-row"><h2>Collections</h2><span>Saved for targeted practice</span></div><div class="two-col"><section class="panel"><h3>${icon('refresh')} Difficult questions <span class="tiny-pill">${difficult.length}</span></h3><p class="sub">Questions you have missed or struggled with.</p>${difficult.length?`<div class="mini-list">${difficult.slice(0,5).map(q=>`<div class="mini-row"><span>Q${q.number} · ${esc(q.categoryName)}</span><strong>${getStats(q.id).incorrect} misses</strong></div>`).join('')}</div><button class="btn secondary small" style="margin-top:14px" data-mode-start="mistakes">Practice mistakes</button>`:'<p class="sub">No difficult questions yet.</p>'}</section><section class="panel"><h3>${icon('bookmark')} Bookmarks <span class="tiny-pill">${bookmarks.length}</span></h3><p class="sub">Questions you chose to save.</p>${bookmarks.length?`<div class="mini-list">${bookmarks.slice(0,5).map(q=>`<div class="mini-row"><span>Q${q.number} · ${esc(q.categoryName)}</span><strong>Saved</strong></div>`).join('')}</div>`:'<p class="sub">Bookmark a question during a session to save it here.</p>'}</section></div><div class="section-row"><h2>Recent sessions</h2><span>Latest ${state.history.length}</span></div><div class="panel">${state.history.length?`<div class="mini-list">${state.history.slice(0,8).map(h=>`<div class="mini-row"><span>${esc(currentModeLabel(h.mode))} · ${formatDate(h.finishedAt)}</span><strong>${h.correct}/${h.total} · ${h.percentage}%</strong></div>`).join('')}</div>`:'<p class="sub" style="margin:0">Your completed sessions will appear here.</p>'}</div>`;}
function renderSettings(){return `<div class="page-head"><div><div class="eyebrow">PREFERENCES & DATA</div><h1>Settings.</h1><p>Control how questions appear and keep a portable backup of your learning.</p></div></div><div class="section-row"><h2>Shuffle preferences</h2><span>Saved automatically</span></div><div class="settings-list"><div class="setting-card"><div><strong>Shuffle questions</strong><p>Randomize the question order within your selected question set.</p></div><label class="toggle"><input type="checkbox" id="pref-shuffle-q" ${state.prefs.shuffleQuestions?'checked':''}><span></span></label></div><div class="setting-card"><div><strong>Shuffle answer choices</strong><p>Randomize A–D display order while retaining each answer's correct mapping.</p></div><label class="toggle"><input type="checkbox" id="pref-shuffle-a" ${state.prefs.shuffleAnswers?'checked':''}><span></span></label></div></div><div class="section-row"><h2>Feedback</h2><span>Optional</span></div><div class="settings-list"><div class="setting-card"><div><strong>Sound feedback</strong><p>Play a short tone after an answer is checked. Requires a browser audio context.</p></div><label class="toggle"><input type="checkbox" id="pref-sound" ${state.prefs.sound?'checked':''}><span></span></label></div><div class="setting-card"><div><strong>Haptic feedback</strong><p>Use a short device vibration where supported by the browser and device.</p></div><label class="toggle"><input type="checkbox" id="pref-haptics" ${state.prefs.haptics?'checked':''}><span></span></label></div></div><div class="section-row"><h2>Your data</h2><span>Local-first</span></div><section class="panel"><h3>Backup and restore</h3><p class="sub">Export includes progress, mastery sessions, schedules, bookmarks, preferences, activity days, and session history. Keep a backup before clearing browser data.</p><div style="display:flex;gap:9px;flex-wrap:wrap"><button class="btn" data-action="export">Export progress JSON ${icon('arrow')}</button><button class="btn secondary" data-action="import">Import progress JSON</button></div><p class="source-note" style="border:0;padding:0;margin-top:12px!important">This app has no server or account sync. Data is stored in this browser's localStorage. Browser privacy settings or file-origin behavior may limit persistence; use Export for a backup.</p></section><section class="panel" style="margin-top:13px;border-color:#f0d8d6"><h3 style="color:var(--red)">Reset learning progress</h3><p class="sub">Permanently clear saved answers, mastery status, schedules, bookmarks, streaks, and session history on this device. The 60-question source bank will remain unchanged.</p><button class="btn danger" data-action="reset">Reset all progress</button></section>`;}
function bindPage(){document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>handlePageAction(b.dataset.action)));document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{setupMode=b.dataset.mode;const f=document.getElementById('setup-filter');if(f)f.value=getSelectedModeFilter(setupMode);updateSetupAvailability();document.querySelector('.setup-panel')?.scrollIntoView({behavior:'smooth',block:'center'});toast(currentModeLabel(setupMode)+' selected. Adjust the setup and start.');}));document.querySelectorAll('#main [data-page]').forEach(b=>b.addEventListener('click',()=>{page=b.dataset.page;state.lastExam=null;state.lastSessionResult=null;saveState();render();}));document.querySelectorAll('[data-mode-start]').forEach(b=>b.addEventListener('click',()=>startSession(b.dataset.modeStart,'all',getSelectedModeFilter(b.dataset.modeStart),60)));['setup-category','setup-filter'].forEach(id=>document.getElementById(id)?.addEventListener('change',updateSetupAvailability));document.getElementById('setup-shuffle-q')?.addEventListener('change',e=>{state.prefs.shuffleQuestions=e.target.checked;saveState();});document.getElementById('setup-shuffle-a')?.addEventListener('change',e=>{state.prefs.shuffleAnswers=e.target.checked;saveState();});['pref-shuffle-q','pref-shuffle-a','pref-sound','pref-haptics'].forEach(id=>document.getElementById(id)?.addEventListener('change',e=>{const map={'pref-shuffle-q':'shuffleQuestions','pref-shuffle-a':'shuffleAnswers','pref-sound':'sound','pref-haptics':'haptics'};state.prefs[map[id]]=e.target.checked;saveState();toast('Preference saved.');}));const fileInput=document.getElementById('import-file');if(fileInput&&!fileInput.dataset.bound){fileInput.addEventListener('change',importProgressFile);fileInput.dataset.bound='1';}}
function handlePageAction(action){switch(action){case'resume':if(state.activeSession){state.quizOpen=true;render();}break;case'quick-start':startSession('practice','all','all',15);break;case'start-setup':{const cat=document.getElementById('setup-category').value,filter=document.getElementById('setup-filter').value,count=document.getElementById('setup-count').value;state.prefs.shuffleQuestions=document.getElementById('setup-shuffle-q').checked;state.prefs.shuffleAnswers=document.getElementById('setup-shuffle-a').checked;saveState();startSession(setupMode,cat,filter,count);break;}case'export':exportProgress();break;case'import':document.getElementById('import-file').click();break;case'reset':showResetModal();break;}}
function exportProgress(){const payload={app:'Knowledge Mastery Quiz',version:1,exportedAt:new Date().toISOString(),questionBankVersion:'source-60-v1',state};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='knowledge-mastery-progress-'+todayKey()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Progress backup exported.');}
function importProgressFile(e){const file=e.target.files&&e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const payload=JSON.parse(reader.result);const incoming=payload.state||payload;if(!incoming||typeof incoming!=='object'||!incoming.progress||!incoming.prefs)throw new Error('Invalid backup');const valid={...cloneData(DEFAULT_STATE),...incoming,prefs:{...DEFAULT_STATE.prefs,...incoming.prefs},progress:incoming.progress||{},history:Array.isArray(incoming.history)?incoming.history:[],activityDays:Array.isArray(incoming.activityDays)?incoming.activityDays:[]};state=valid;saveState();toast('Progress restored from backup.');render();}catch(err){toast('That file is not a valid Knowledge Mastery backup.');}e.target.value='';};reader.readAsText(file);}

function showRestartModal(){const s=state.activeSession;if(!s)return;const config={mode:s.mode,category:s.category,filter:s.filter,count:s.count};document.getElementById('modal-root').innerHTML=`<div class="modal-backdrop" role="presentation"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="restart-title"><h3 id="restart-title">Restart this session?</h3><p>Your current question order and in-progress exam selections will be discarded. Answers already checked in Practice mode remain part of your learning history. A fresh session will start with the same category and question-set settings.</p><div class="modal-actions"><button class="btn secondary" data-restart="cancel">Keep going</button><button class="btn" data-restart="confirm">Restart session</button></div></div></div>`;document.querySelector('[data-restart="cancel"]').addEventListener('click',()=>document.getElementById('modal-root').innerHTML='');document.querySelector('[data-restart="confirm"]').addEventListener('click',()=>{document.getElementById('modal-root').innerHTML='';startSession(config.mode,config.category,config.filter,config.count);toast('Fresh session started.');});}
function showResetModal(){document.getElementById('modal-root').innerHTML=`<div class="modal-backdrop" role="presentation"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="reset-title"><h3 id="reset-title">Reset all learning progress?</h3><p>This clears all locally saved answers, mastery records, review schedules, bookmarks, streaks, session history, and any active session. Your original 60-question bank will remain available. This action cannot be undone unless you exported a backup.</p><div class="modal-actions"><button class="btn secondary" data-modal="cancel">Cancel</button><button class="btn danger" data-modal="confirm">Reset progress</button></div></div></div>`;document.querySelector('[data-modal="cancel"]').addEventListener('click',()=>document.getElementById('modal-root').innerHTML='');document.querySelector('[data-modal="confirm"]').addEventListener('click',()=>{state=cloneData(DEFAULT_STATE);saveState();document.getElementById('modal-root').innerHTML='';page='home';toast('Learning progress reset.');render();});}
// Basic integrity assertions: 60 source questions, four options each, and valid A–D answer keys.
function validateQuestionBank(){if(QUESTIONS.length!==60)throw new Error('Question bank must contain exactly 60 questions.');const categoryCounts=CATEGORIES.map((_,i)=>QUESTIONS.filter(q=>q.category===i).length);if(categoryCounts.some(n=>n!==15))throw new Error('Each category must contain exactly 15 questions.');QUESTIONS.forEach(q=>{if(q.options.length!==4||new Set(q.options.map(o=>o.key)).size!==4||!LETTERS.includes(q.correctKey))throw new Error('Invalid question or answer mapping: '+q.id);});if(QUESTIONS.some(q=>!q.text||q.options.some(o=>!o.text)))throw new Error('Missing question content.');return categoryCounts;}
validateQuestionBank();render();
if(document.addEventListener){document.addEventListener('keydown',e=>{if(!state.quizOpen||!state.activeSession)return;const tag=e.target&&e.target.tagName;if(['INPUT','SELECT','TEXTAREA'].includes(tag))return;const s=state.activeSession,q=currentQuestion();if(!q)return;if(/^[1-4]$/.test(e.key)){const key=currentOptionOrder(q.id)[Number(e.key)-1];if(s.mode==='exam')s.answers[q.id]=key;else if(!s.submitted[q.id])s.drafts[q.id]=key;else return;saveState();render();e.preventDefault();return;}if(e.key==='Enter'&&tag!=='BUTTON'&&!e.repeat){if(s.mode==='exam'){if(s.currentIndex<s.queue.length-1)handleQuizAction('next-exam');else if(Object.keys(s.answers).length===s.queue.length)finishExam();}else if(!s.submitted[q.id]&&s.drafts[q.id])handleQuizAction('submit-answer');else if(s.submitted[q.id])handleQuizAction('next-question');e.preventDefault();}});}
</script>
